<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 494" width="340" height="494">
  <!-- One broken bond in silicon, drawn two ways, stacked. Top, the bond picture,
       in the crystal sim's style: Si atoms on a flat square grid, each bond two lines
       with its two electrons at the middle, one on each line (grey dots). One bond has lost an electron: the red ring is
       the hole, the blue dot is the freed electron sitting between atoms. Below, the
       band picture of the same event: the full valence band (grey dots), the empty
       conduction band, the gap E_g between, one electron (blue) lifted across the gap
       and the empty state it left (red ring). The dashed leaders tie each mark in the
       bond picture to its partner in the band picture. viewBox width 340 and text
       >= 15 px, so labels stay >= 13 px in a 310 px phone frame. Transparent
       background and mid-tone colours, as the other figures. -->
