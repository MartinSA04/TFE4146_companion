<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 330" width="340" height="330">
  <!-- The six conduction-band valleys of Si (as daler.svg) with the field along x. The two valleys on
       the k_x axis (darker) have their long axis along the field, so the mass along the field is m_l;
       the four others lie across it, mass m_t along the field. Oblique projection, k_z toward the viewer.
       Transparent background and mid-tone colours, as the other figures. -->
  <defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d98a6"/></marker><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6f7a88"/></marker><radialGradient id="pale" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#a9c7ea" stop-opacity="0.35"/><stop offset="100%" stop-color="#3d7cc4" stop-opacity="0.4"/></radialGradient><radialGradient id="deep" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#a9c7ea" stop-opacity="0.7"/><stop offset="100%" stop-color="#3d7cc4" stop-opacity="0.85"/></radialGradient></defs>
  <line x1="118" y1="22" x2="222" y2="22" stroke="#6f7a88" stroke-width="2" marker-end="url(#ink)"/>
  <text x="108" y="28" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6f7a88" text-anchor="end">ℰ</text>
  <text x="232" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7c8795" text-anchor="start">langs x</text>
  <g stroke="#8d98a6" stroke-width="1.2" fill="none">
    <line x1="28" y1="168" x2="312" y2="168" marker-end="url(#ax)"/>
    <line x1="170" y1="281.6" x2="170" y2="57.2" marker-end="url(#ax)"/>
    <line x1="248.1" y1="114" x2="91.9" y2="222" marker-end="url(#ax)"/>
  </g>
  <text x="310" y="188" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="end">k<tspan dy="5" font-size="13">x</tspan></text>
  <text x="192" y="87.2" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="start">k<tspan dy="5" font-size="13">y</tspan></text>
  <text x="93.9" y="242" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="middle">k<tspan dy="5" font-size="13">z</tspan></text>
  <ellipse cx="215.1" cy="136.8" rx="25.4" ry="13.5" transform="rotate(145.4 215.1 136.8)" fill="url(#pale)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="170" cy="86" rx="13.5" ry="32" transform="rotate(0 170 86)" fill="url(#pale)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="170" cy="250" rx="13.5" ry="32" transform="rotate(0 170 250)" fill="url(#pale)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="88" cy="168" rx="32" ry="13.5" transform="rotate(0 88 168)" fill="url(#deep)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="252" cy="168" rx="32" ry="13.5" transform="rotate(0 252 168)" fill="url(#deep)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="124.9" cy="199.2" rx="25.4" ry="13.5" transform="rotate(145.4 124.9 199.2)" fill="url(#pale)" stroke="#3d7cc4" stroke-width="1.3"/>
  <line x1="223" y1="191.5" x2="281" y2="191.5" stroke="#6f7a88" stroke-width="1.4" marker-start="url(#ink)" marker-end="url(#ink)"/>
  <text x="252" y="213.5" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6f7a88" text-anchor="middle">m<tspan dy="5" font-size="13">l</tspan></text>
  <line x1="157.5" y1="45" x2="182.5" y2="45" stroke="#6f7a88" stroke-width="1.4" marker-start="url(#ink)" marker-end="url(#ink)"/>
  <text x="148.5" y="51" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6f7a88" text-anchor="end">m<tspan dy="5" font-size="13">t</tspan></text>
  <text x="12" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6f7a88">2 daler langs feltet: <tspan font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18">m</tspan><tspan font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="13" dy="5">l</tspan></text>
  <text x="12" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7c8795">4 daler på tvers: <tspan font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18">m</tspan><tspan font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="13" dy="5">t</tspan></text>
</svg>
