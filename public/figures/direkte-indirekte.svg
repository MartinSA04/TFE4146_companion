<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 486" width="340" height="486">
  <!-- Direct and indirect band gap, sketched as E(k) over the first zone, k from
       -pi/a to pi/a, stacked on the same k ticks. Top, GaAs: the conduction-band
       minimum lies straight above the valence-band maximum at k = 0, so the electron
       (blue) drops straight onto the hole (red ring) and the energy leaves as a
       photon, h nu = E_g (wavy arrow). Below, Si: the conduction-band minima lie at
       k = +-0.85 pi/a (toward X). The electron reaches the hole at k = 0 only if a
       phonon supplies the change in k (horizontal violet arrow) in the same event in
       which a photon carries the energy away (wavy arrow). Clean parabola-like curves, not a
       computed band structure; the Si gap is drawn 0.8 times the GaAs gap. viewBox
       width 340 and text >= 15 px. Transparent background and mid-tone colours, as
       the other figures. -->
