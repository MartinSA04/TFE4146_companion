<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 250" width="340" height="250">
  <!-- The band picture of doping (Streetman Fig. 3-12 style). Left, n-type (phosphorus):
       dashed donor level E_d just below E_c with four donor sites; three are ionized
       (orange plus-in-circle) and their electrons (blue) sit in the conduction band,
       with short arrows up from the level; the fourth still holds its electron (blue
       dot on the level). Right, p-type (boron): dashed acceptor level E_a just above
       E_v with four acceptor sites; three are ionized (orange minus-in-circle), each
       having taken an electron from the valence band (blue arrow) and left a hole (red
       ring); the fourth still holds its hole (red ring on the level). Not to scale:
       E_c - E_d and E_a - E_v are drawn 1/6 of the gap (really about 1/25). viewBox
       width 340 and text >= 15 px. Transparent background and mid-tone colours, as the
       other figures. -->
