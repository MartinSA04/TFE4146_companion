<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 438" width="340" height="438">
  <!-- Constant-energy surfaces near the bottom of the conduction band (Streetman fig. 3-10, the
       lecture's DOS-mass slide). Top: GaAs, one spherical valley at k = 0. Bottom: Si, six cigar-shaped
       valleys along ±k_x, ±k_y, ±k_z; the long axis belongs to m_l and the short ones to m_t (semi-axes
       in the ratio √(m_l/m_t) ≈ 2.3). Oblique projection, k_z toward the viewer.
       Transparent background and mid-tone colours, as the other figures. -->
  <defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d98a6"/></marker><radialGradient id="shade" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#a9c7ea" stop-opacity="0.6"/><stop offset="100%" stop-color="#3d7cc4" stop-opacity="0.7"/></radialGradient></defs>
  <text x="12" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6f7a88" text-anchor="start" font-weight="600">GaAs</text>
  <text x="12" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7c8795" text-anchor="start">én dal, ved k = 0</text>
  <g stroke="#8d98a6" stroke-width="1.2" fill="none">
    <line x1="104" y1="84" x2="236" y2="84" marker-end="url(#ax)"/>
    <line x1="170" y1="136.8" x2="170" y2="27.9" marker-end="url(#ax)"/>
    <line x1="206.3" y1="58.9" x2="133.7" y2="109.1" marker-end="url(#ax)"/>
  </g>
  <text x="234" y="104" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="end">k<tspan dy="5" font-size="13">x</tspan></text>
  <text x="179" y="39.9" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="start">k<tspan dy="5" font-size="13">y</tspan></text>
  <text x="135.7" y="129.1" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="middle">k<tspan dy="5" font-size="13">z</tspan></text>
  <circle cx="170" cy="84" r="34" fill="url(#shade)" stroke="#3d7cc4" stroke-width="1.3"/>
  <text x="12" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#6f7a88" text-anchor="start" font-weight="600">Si</text>
  <text x="12" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7c8795" text-anchor="start">seks daler</text>
  <g stroke="#8d98a6" stroke-width="1.2" fill="none">
    <line x1="28" y1="296" x2="312" y2="296" marker-end="url(#ax)"/>
    <line x1="170" y1="409.6" x2="170" y2="175.3" marker-end="url(#ax)"/>
    <line x1="248.1" y1="242" x2="91.9" y2="350" marker-end="url(#ax)"/>
  </g>
  <text x="310" y="316" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="end">k<tspan dy="5" font-size="13">x</tspan></text>
  <text x="179" y="187.3" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="start">k<tspan dy="5" font-size="13">y</tspan></text>
  <text x="93.9" y="370" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#7c8795" text-anchor="middle">k<tspan dy="5" font-size="13">z</tspan></text>
  <ellipse cx="215.1" cy="264.8" rx="25.4" ry="13.5" transform="rotate(145.4 215.1 264.8)" fill="url(#shade)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="170" cy="214" rx="13.5" ry="32" transform="rotate(0 170 214)" fill="url(#shade)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="88" cy="296" rx="32" ry="13.5" transform="rotate(0 88 296)" fill="url(#shade)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="252" cy="296" rx="32" ry="13.5" transform="rotate(0 252 296)" fill="url(#shade)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="170" cy="378" rx="13.5" ry="32" transform="rotate(0 170 378)" fill="url(#shade)" stroke="#3d7cc4" stroke-width="1.3"/>
  <ellipse cx="124.9" cy="327.2" rx="25.4" ry="13.5" transform="rotate(145.4 124.9 327.2)" fill="url(#shade)" stroke="#3d7cc4" stroke-width="1.3"/>
  <path d="M 56 273.5 H 120 M 56 278.5 V 268.5 M 120 278.5 V 268.5" stroke="#6f7a88" stroke-width="1.3" fill="none"/>
  <text x="88" y="262.5" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6f7a88" text-anchor="middle">m<tspan dy="5" font-size="13">l</tspan></text>
  <path d="M 47 282.5 V 309.5 M 42 282.5 H 52 M 42 309.5 H 52" stroke="#6f7a88" stroke-width="1.3" fill="none"/>
  <text x="47" y="331.5" font-family="KaTeX_Math, 'Times New Roman', serif" font-style="italic" font-size="18" fill="#6f7a88" text-anchor="middle">m<tspan dy="5" font-size="13">t</tspan></text>
</svg>
