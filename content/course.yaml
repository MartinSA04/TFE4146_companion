# Formelsamlingen. Merk: ingen formel er merket `memorize`. Hva som havner på
# det utdelte formelarket er ikke kjent før nær eksamen, og guiden skal ikke
# påstå noe om det. Sett `memorize: true` per formel når arket foreligger.
formulas:
  - id: bloch-funksjon
    section: E–k-diagrammet
    tex: "\\psi_k(x) = U(k_x, x)\\, e^{jk_x x}"
    label: "Bloch-funksjonen består av to faktorer. $e^{jk_x x}$ er en planbølge, og $U(k_x, x)$ er en funksjon som gjentar seg med gitterets periode, $U(k_x, x + a) = U(k_x, x)$. Elektronet i krystallen er ikke fritt, og beskrives likevel av én bølgevektor $k$."
  - id: gruppehastighet
    section: E–k-diagrammet
    tex: "v = \\dfrac{1}{\\hbar}\\dfrac{dE}{dk}"
    label: "Bærerens hastighet er gruppehastigheten til bølgepakken, altså <b>stigningstallet</b> i $E(k)$. På bunnen av båndet er $v = 0$ selv om $\\hbar k \\neq 0$."
  - id: krystallmomentum
    section: Effektiv masse
    tex: "F_\\text{ytre} = \\dfrac{d(\\hbar k)}{dt}"
    label: "Akselerasjonsteoremet. Bare den <em>ytre</em> kraften står på høyresiden, for gitterkreftene ligger allerede inne i formen på $E(k)$. Derfor er $\\hbar k$ <b>krystallmomentum</b> og ikke elektronets ekte bevegelsesmengde."
  - id: effektiv-masse
    section: Effektiv masse
    tex: "m^* = \\dfrac{\\hbar^2}{d^2E/dk^2}"
    label: "Effektiv masse fra <b>krumningen</b> til båndet. Med $m^*$ i Newtons lov holder $F = ma$ med bare den ytre kraften, siden gitterkreftene er pakket inn i tallet. Skarp krumning gir liten $m^*$, flatt bånd gir stor. Negativ krumning på valensbåndtoppen er grunnen til at vi regner med hull der."
  - id: parabolsk-band
    section: Effektiv masse
    tex: "E = E_c + \\dfrac{\\hbar^2 k^2}{2m^*}"
    label: "Parabolsk tilnærming nær et båndminimum. Så lenge båndet er parabolsk er $m^*$ <em>konstant</em>; høyere opp i båndet holder ikke tilnærmingen."
  - id: fullt-band-strom
    section: Elektroner og hull
    tex: "J = (-q)\\sum_{i=1}^{N} v_i = 0 \\quad\\Longrightarrow\\quad J = (-q)\\sum_{i=1}^{N} v_i - (-q)v_j = +q\\,v_j"
    label: "Et fullt bånd gir null strøm. Fjerner du elektron $j$, blir summen $+qv_j$, altså <em>nøyaktig</em> strømmen fra én positiv ladning med det manglende elektronets hastighet. Det er hullets opprinnelse."
  - id: generasjon-rekombinasjon
    section: Intrinsisk materiale
    tex: "r_i = a_r n_0 p_0 = g_i"
    label: "Likevekt er <em>dynamisk</em>: rekombinasjonsraten $r_i$ er proporsjonal med produktet $n_0p_0$, fordi et elektron og et hull må møtes, og den balanserer generasjonsraten $g_i$. Siden $g_i$ bare avhenger av temperaturen, er produktet låst: $n_0p_0 = n_i^2$."
  - id: hydrogenlik-donor
    section: Doping
    tex: "E_d = 13{,}6\\ \\text{eV}\\cdot\\dfrac{m_n^*/m_0}{\\varepsilon_r^2}, \\qquad a^* = a_0\\,\\dfrac{\\varepsilon_r}{m_n^*/m_0}"
    label: "Hydrogenatomets egne resultater med to bytter: lettere elektron ($m_n^*$) og skjermet Coulomb-kraft ($\\varepsilon_r$). Med $a_0 = 0{,}529$ Å gir det $25$ meV og $24$ Å for Si. Anslaget ligger konsekvent under det målte, fordi elektronet nær kjernen verken ser full $\\varepsilon_r$ eller én isotrop masse."
  - id: fermi-dirac
    section: Fermi–Dirac-fordelingen
    tex: "f(E) = \\dfrac{1}{1 + e^{(E - E_F)/kT}}"
    label: "Sannsynligheten for at en tillatt tilstand ved energi $E$ er okkupert ved termisk likevekt. $f(E_F) = \\tfrac{1}{2}$, og fordelingen er symmetrisk om nivået: $f(E_F + \\Delta E) = 1 - f(E_F - \\Delta E)$. Ved 300 K er $kT = 0{,}0259$ eV."
  - id: likevektskonsentrasjoner
    section: Fra fordeling til konsentrasjon
    tex: "n_0 = N_c\\, e^{-(E_c - E_F)/kT}, \\qquad p_0 = N_v\\, e^{-(E_F - E_v)/kT}"
    label: "Likevektskonsentrasjonene når $E_F$ ligger noen $kT$ fra båndkantene (Boltzmann-tilnærmingen). Avstanden fra $E_F$ til kanten står i eksponenten: 60 meV per tierpotens ved romtemperatur."
  - id: effektiv-tilstandstetthet
    section: Fra fordeling til konsentrasjon
    tex: "N_c = 2\\left(\\dfrac{2\\pi m_n^* kT}{h^2}\\right)^{3/2}"
    label: "Effektiv tilstandstetthet: hele ledningsbåndet regnet som $N_c$ tilstander lagt på $E_c$, slik at $n_0 = N_c f(E_c)$. For Si ved 300 K er $N_c \\approx 2{,}9 \\times 10^{19}$ cm⁻³ og $N_v \\approx 1{,}0 \\times 10^{19}$ cm⁻³; begge vokser som $T^{3/2}$."
  - id: massevirkningsloven
    section: Massevirkningsloven
    tex: "n_0 p_0 = n_i^2"
    label: "Ved termisk likevekt er produktet låst av materialet og temperaturen, uansett doping: dobler dopingen $n_0$, halveres $p_0$. Samme innhold som ratebalansen $r_i = a_r n_0 p_0 = g_i$, siden generasjonen bare avhenger av temperaturen."
  - id: intrinsisk-konsentrasjon
    section: Massevirkningsloven
    tex: "n_i = \\sqrt{N_c N_v}\\; e^{-E_g/2kT}"
    label: "Intrinsisk konsentrasjon, med <b>halve</b> gapet i eksponenten fordi $E_F$ ligger nær midten av det. For Si ved 300 K er $n_i = 1{,}5 \\times 10^{10}$ cm⁻³. Eksponenten dominerer temperaturavhengigheten; $T^{3/2}$-faktorene fra $N_c$ og $N_v$ synes knapt ved siden av."
  - id: ni-formene
    section: Massevirkningsloven
    tex: "n_0 = n_i\\, e^{(E_F - E_i)/kT}, \\qquad p_0 = n_i\\, e^{(E_i - E_F)/kT}"
    label: "Likevektskonsentrasjonene målt fra det intrinsiske nivået $E_i$. Står $E_F$ på $E_i$, er $n_0 = p_0 = n_i$, og avstanden $E_F - E_i$ forteller direkte hvor sterkt dopet materialet er."
  - id: dos-masse
    section: Effektiv masse for tilstandstetthet
    tex: "(m_n^*)^{3/2} = 6\\,(m_l\\, m_t^2)^{1/2}"
    label: "Effektiv masse for tilstandstetthet i Si: geometrisk middel av krumningsmassene i én dal, ganget opp med de seks dalene. Med $m_l = 0{,}98\\,m_0$ og $m_t = 0{,}19\\,m_0$ gir det $m_n^* = 1{,}1\\,m_0$, tallet som hører hjemme i $N_c$."
  - id: ladningsnoytralitet
    section: Kompensasjon og ladningsnøytralitet
    tex: "p_0 + N_d^+ = n_0 + N_a^-"
    label: "Ladningsnøytralitet: summen av positiv ladning (hull og ioniserte donorer) er lik summen av negativ (elektroner og ioniserte akseptorer). Sammen med $n_0 p_0 = n_i^2$ bestemmer kravet $n_0$, $p_0$ og $E_F$ entydig."

glossary:
  - term: Valensbånd
    section: Fra binding til bånd
    definition: "(<em>valence band</em>) Det øverste båndet som er fullt av elektroner ved 0 K. Toppen betegnes $E_v$. I Si rommer det $4N$ tilstander, akkurat nok til de $4N$ valenselektronene."
  - term: Ledningsbånd
    section: Fra binding til bånd
    definition: "(<em>conduction band</em>) Det nederste tomme båndet ved 0 K, med bunnen $E_c$. Elektroner som eksiteres hit har mange ledige tilstander rundt seg og kan derfor bidra til strøm."
  - term: Bloch-funksjon
    section: E–k-diagrammet
    definition: "Bølgefunksjonen til et elektron i et periodisk gitter: en planbølge multiplisert med en funksjon som har gitterets periodisitet. Den er grunnlaget for å beskrive elektronet ved én bølgevektor $k$."
  - term: E-k-diagram
    section: E–k-diagrammet
    definition: "Plott av elektronets totale energi mot bølgevektoren $k$, for én krystallretning. Stigningstallet gir hastigheten, krumningen gir effektiv masse, og formen avgjør om halvlederen er direkte eller indirekte."
  - term: Gruppehastighet
    section: E–k-diagrammet
    definition: "(<em>group velocity</em>) Farten til bølgepakken bæreren består av, $v = \\frac{1}{\\hbar}\\frac{dE}{dk}$, altså <b>stigningstallet</b> i $E(k)$. På bunnen av båndet er den null, uansett hvor stor $k$ er."
  - term: Direkte halvleder
    section: E–k-diagrammet
    definition: "(<em>direct semiconductor</em>) Ledningsbåndminimet og valensbåndmaksimet ligger ved <b>samme</b> $k$, som i GaAs ($E_g = 1{,}43$ eV). Et elektron kan falle rett ned og gi fra seg $E_g$ som et foton, og derfor brukes slike materialer i lysdioder og lasere."
  - term: Indirekte halvleder
    section: E–k-diagrammet
    definition: "(<em>indirect semiconductor</em>) Ledningsbåndminimet ligger ved en <b>annen</b> $k$ enn valensbåndmaksimet, som i Si. Overgangen krever en momentumendring i tillegg til energiendringen, og går gjerne via en defekttilstand med energien avgitt som varme."
  - term: Fonon
    section: E–k-diagrammet
    definition: "(<em>phonon</em>) Et kvantum av gittervibrasjon. Det bærer momentum på Brillouinsonens skala og svært lite energi, og er derfor partneren en indirekte halvleder må låne momentum av. Fotonet betaler energien, fononet momentumet."
  - term: Krystallmomentum
    section: Effektiv masse
    definition: "(<em>crystal momentum</em>) Størrelsen $\\hbar k$. Den oppfører seg som bevegelsesmengde overfor <em>ytre</em> krefter, og er likevel ikke elektronets virkelige bevegelsesmengde, siden gitterkreftene er utelatt."
  - term: Effektiv masse
    section: Effektiv masse
    definition: "(<em>effective mass</em>) Massen $m^*$ som lar oss bruke Newtons lov på en bærer i et gitter uten å regne på gitterkreftene: de er allerede pakket inn i tallet. Den finnes fra krumningen til $E(k)$, og er derfor ulik i ulike materialer selv om elektronets <em>ekte</em> masse er den samme."
  - term: Hull
    section: Elektroner og hull
    definition: "(<em>hole</em>) En tom tilstand i valensbåndet, regnet som én bærer med <b>positiv</b> ladning og <b>positiv</b> masse. Strømmen bæres av de gjenværende elektronene, og hullregnskapet gir samme svar med ett ledd i stedet for $10^{23}$."
  - term: Elektron-hull-par
    section: Intrinsisk materiale
    definition: "(<em>electron-hole pair</em>) Et ledningsbåndelektron og hullet det etterlot seg i valensbåndet, laget i samme eksitasjon (EHP). Termisk eller optisk energi $\\ge E_g$ kreves for å lage ett."
  - term: Intrinsisk halvleder
    section: Intrinsisk materiale
    definition: "(<em>intrinsic semiconductor</em>) En perfekt krystall uten dopanter eller gitterfeil, der de eneste bærerne er termisk genererte par. Da er $n = p = n_i$."
  - term: Ekstrinsisk halvleder
    section: Doping
    definition: "(<em>extrinsic semiconductor</em>) En halvleder der dopanter gjør likevektskonsentrasjonene $n_0$ og $p_0$ forskjellige fra $n_i$. Nesten alle komponenter er bygd av ekstrinsisk materiale."
  - term: Donor
    section: Doping
    definition: "En urenhet fra gruppe V (P, As, Sb) i Si eller Ge, med ett valenselektron til overs. Den legger et fylt nivå $E_d$ like under $E_c$ og står igjen som et fast positivt ion når elektronet er avgitt. Ved romtemperatur er praktisk talt alle ionisert i Si."
  - term: Akseptor
    section: Doping
    definition: "En urenhet fra gruppe III (B, Al, Ga, In) i Si eller Ge, med ett valenselektron for lite. Den legger et tomt nivå $E_a$ like over $E_v$, tar imot et valensbåndelektron og etterlater et hull."
  - term: n-type materiale
    section: Doping
    definition: "Halvleder dopet med donorer, der $n_0 \\gg (n_i, p_0)$. Elektroner er majoritetsbærere, hull er minoritetsbærere."
  - term: p-type materiale
    section: Doping
    definition: "Halvleder dopet med akseptorer, der $p_0 \\gg (n_i, n_0)$. Hull er majoritetsbærere, elektroner er minoritetsbærere."
  - term: Majoritetsbærere
    section: Doping
    definition: "(<em>majority carriers</em>) Bærertypen som dominerer etter doping, altså elektroner i n-type og hull i p-type. Dopingen kan endre antallet med mange tierpotenser."
  - term: Minoritetsbærere
    section: Doping
    definition: "(<em>minority carriers</em>) Den fåtallige bærertypen, altså hull i n-type og elektroner i p-type. De er få, og de styrer likevel oppførselen til pn-overganger og bipolare transistorer."
  - term: Fermi-Dirac-fordelingen
    section: Fermi–Dirac-fordelingen
    definition: "(<em>Fermi–Dirac distribution</em>) $f(E) = [1 + e^{(E - E_F)/kT}]^{-1}$, sannsynligheten for at en tillatt tilstand er okkupert ved termisk likevekt. Følger av at elektroner er identiske, har bølgenatur og lyder Pauli-prinsippet. Ved 0 K er den en firkant: alt under $E_F$ fullt, alt over tomt."
  - term: Fermi-nivå
    section: Fermi–Dirac-fordelingen
    definition: "(<em>Fermi level</em>) Energien $E_F$ der sannsynligheten for okkupasjon er nøyaktig $\\tfrac{1}{2}$. Fordelingen er symmetrisk om nivået, og plasseringen i gapet bærer hele bærerbildet: nær midten i intrinsisk materiale, nær $E_c$ i n-type og nær $E_v$ i p-type."
  - term: Tilstandstetthet
    section: Fra fordeling til konsentrasjon
    definition: "(<em>density of states</em>) $N(E)$, antall tilstander per volum og energienhet. Nær en båndkant vokser den som $\\sqrt{E - E_c}$, fra null på selve kanten. Produktet $f(E)N(E)$ er det som telles når $n_0$ skal regnes ut."
  - term: Effektiv tilstandstetthet
    section: Fra fordeling til konsentrasjon
    definition: "(<em>effective density of states</em>) $N_c$ og $N_v$: alle båndets fordelte tilstander representert som ett tall lagt på båndkanten, slik at $n_0 = N_c f(E_c)$. Av størrelsesorden $10^{19}$ cm⁻³ for Si ved 300 K, temperaturavhengig som $T^{3/2}$."
  - term: Boltzmann-tilnærmingen
    section: Fra fordeling til konsentrasjon
    definition: "(<em>Boltzmann approximation</em>) $f(E) \\approx e^{-(E - E_F)/kT}$ når $E - E_F$ er flere $kT$. Gjelder for vanlig doping, der $E_F$ holder seg unna båndkantene; svikter når dopingen presser $E_F$ helt inntil en kant."
  - term: Massevirkningsloven
    section: Massevirkningsloven
    definition: "(<em>mass action law</em>) $n_0 p_0 = n_i^2$ ved termisk likevekt, uansett doping. Doper du inn flere elektroner, forsvinner hull i samme faktor, og produktet står stille."
  - term: Intrinsisk nivå
    section: Massevirkningsloven
    definition: "(<em>intrinsic level</em>) $E_i$, energien $E_F$ har i intrinsisk materiale. Nivået ligger nær midten av gapet, forskjøvet litt fordi $N_c \\neq N_v$; i Si omtrent 13 meV under midten ved romtemperatur."
  - term: Kompensasjon
    section: Kompensasjon og ladningsnøytralitet
    definition: "(<em>compensation</em>) Donorer og akseptorer i samme krystall opphever hverandre: akseptornivåene fylles av donerte elektroner, og ledningsbåndet sitter igjen med netto $N_d - N_a$. Med $N_a = N_d$ oppfører materialet seg intrinsisk, fullt av dopanter."
  - term: Ladningsnøytralitet
    section: Kompensasjon og ladningsnøytralitet
    definition: "(<em>space charge neutrality</em>) Kravet $p_0 + N_d^+ = n_0 + N_a^-$: krystallen er nøytral, så positiv og negativ ladning balanserer. $E_F$ stiller seg dit kravet og massevirkningsloven er oppfylt samtidig."

