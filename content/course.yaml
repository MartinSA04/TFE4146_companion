  # ── Bærere og konsentrasjoner ──
  - { tex: "n,\\ p", meaning: "Konsentrasjonen av elektroner i ledningsbåndet og hull i valensbåndet", unit: "cm⁻³", section: "Bærere og konsentrasjoner", id: n }
  - { tex: "n_0,\\ p_0", meaning: "Likevektskonsentrasjonene", unit: "cm⁻³", section: "Bærere og konsentrasjoner", formula: likevektskonsentrasjoner }
  - { tex: "n_i", meaning: "Intrinsisk bærerkonsentrasjon", unit: "cm⁻³", section: "Bærere og konsentrasjoner", term: "Intrinsisk halvleder", formula: intrinsisk-konsentrasjon, id: ni, note: "$1{,}5 \\times 10^{10}$ cm⁻³ for Si ved 300 K." }
  - { tex: "n_n,\\ p_n", meaning: "Elektron- og hullkonsentrasjonen på n-siden av en pn-overgang", unit: "cm⁻³", section: "Bærere og konsentrasjoner", note: "Tilsvarende $n_p$ og $p_p$ på p-siden. Indeksen sier hvilken side, bokstaven hvilken bærer." }
  - { tex: "N_c,\\ N_v", meaning: "Effektiv tilstandstetthet i lednings- og valensbåndet", unit: "cm⁻³", section: "Bærere og konsentrasjoner", term: "Effektiv tilstandstetthet", formula: effektiv-tilstandstetthet, id: nc, note: "$2{,}9 \\times 10^{19}$ og $1{,}0 \\times 10^{19}$ cm⁻³ for Si ved 300 K." }
  - { tex: "N_d,\\ N_a", meaning: "Konsentrasjonen av donorer og akseptorer", unit: "cm⁻³", section: "Bærere og konsentrasjoner", term: "Akseptor" }
  - { tex: "N_d^+,\\ N_a^-", meaning: "Konsentrasjonen av <em>ioniserte</em> donorer og akseptorer", unit: "cm⁻³", section: "Bærere og konsentrasjoner", formula: ladningsnoytralitet, note: "Lik $N_d$ og $N_a$ ved romtemperatur i Si." }
  - { tex: "f(E)", meaning: "Fermi–Dirac-fordelingen, sannsynligheten for at en tilstand er okkupert", section: "Bærere og konsentrasjoner", term: "Fermi-Dirac-fordelingen", formula: fermi-dirac }
  - { tex: "N(E)", meaning: "Tilstandstettheten, antall tilstander per volum og energi", unit: "cm⁻³·eV⁻¹", section: "Bærere og konsentrasjoner", term: "Tilstandstetthet" }
  # ── Transport ──
  - { tex: "\\mathcal{E}", meaning: "Elektrisk felt", unit: "V/cm", section: "Transport", term: "Innebygd felt", formula: felt-baandskjema, id: e-felt, note: "Ikke energien $E$. Positiv retning er den et hull driver i." }
  - { tex: "\\mathcal{B}", meaning: "Magnetisk flukstetthet, i Hall-effekten", unit: "Wb/cm²", section: "Transport", term: "Hall-effekten", formula: hall-koeffisient, note: "$1$ Wb/cm² $= 10^4$ T. Hører sammen med $v$ i cm/s og $\\mathcal{E}$ i V/cm." }
  - { tex: "\\mathcal{V}", meaning: "Elektrostatisk potensial", unit: "V", section: "Transport", formula: poisson, id: potensial, note: "Ikke spenningen $V$ over komponenten. $\\mathcal{E} = -d\\mathcal{V}/dx$." }
  - { tex: "\\langle v_x\\rangle", meaning: "Drifthastigheten", unit: "cm/s", section: "Transport", formula: drifthastighet }
  - { tex: "v_s", meaning: "Metningshastigheten ved sterkt felt", unit: "cm/s", section: "Transport", term: "Metningshastighet", note: "Omtrent $10^7$ cm/s i Si." }
  - { tex: "\\mu_n,\\ \\mu_p", meaning: "Mobiliteten til elektroner og hull, drifthastighet per felt", unit: "cm²/V·s", section: "Transport", term: "Mobilitet", formula: mobilitet, id: mu, note: "$1350$ og $480$ cm²/V·s i rent Si ved 300 K. Alltid positiv." }
  - { tex: "\\bar{t}", meaning: "Midlere tid mellom kollisjoner", unit: "s", section: "Transport", term: "Midlere kollisjonstid", formula: mobilitet, id: tbar, note: "Ikke levetiden $\\tau_n$, $\\tau_p$, som er tiden før rekombinasjon." }
  - { tex: "l", meaning: "Midlere fri veilengde mellom kollisjoner", unit: "cm", section: "Transport", term: "Diffusjonskoeffisient" }
  - { tex: "\\sigma", meaning: "Ledningsevne", unit: "(Ω·cm)⁻¹", section: "Transport", formula: ledningsevne }
  - { tex: "\\rho", meaning: "Resistivitet, $1/\\sigma$", unit: "Ω·cm", section: "Transport", formula: resistans, note: "Ikke romladningstettheten $\\rho(x)$ i Poissons ligning." }
  - { tex: "R", meaning: "Resistansen til en stav, $\\rho L/wt$", unit: "Ω", section: "Transport", formula: resistans, note: "$L$ er lengden langs strømmen, $w$ bredden og $t$ tykkelsen." }
  - { tex: "J", meaning: "Strømtetthet, $J_n + J_p$", unit: "A/cm²", section: "Transport", formula: driftdiffusjonsstrom, note: "$J_n$ og $J_p$ er bidragene fra hver bærertype; hver har et drift- og et diffusjonsledd." }
  - { tex: "I", meaning: "Strøm, $J$ ganger tverrsnittet", unit: "A", section: "Transport", formula: diodeligning }
  - { tex: "R_H", meaning: "Hall-koeffisienten", unit: "cm³/C", section: "Transport", term: "Hall-koeffisient", formula: hall-koeffisient, note: "Negativ for elektroner, positiv for hull." }
  - { tex: "D_n,\\ D_p", meaning: "Diffusjonskoeffisienten til elektroner og hull", unit: "cm²/s", section: "Transport", term: "Diffusjonskoeffisient", formula: einstein, id: d, note: "$35$ og $12{,}5$ cm²/s i Si ved 300 K." }
  - { tex: "\\phi", meaning: "Partikkelfluks, antall bærere per areal og tid", unit: "cm⁻²·s⁻¹", section: "Transport", formula: diffusjonsstrom, note: "Strømtettheten er fluksen ganger ladningen." }
  # ── Overskuddsbærere ──
  - { tex: "\\delta n,\\ \\delta p", meaning: "Overskuddet av bærere ut over likevekt, $n - n_0$ og $p - p_0$", unit: "cm⁻³", section: "Overskuddsbærere", term: "Overskuddsbærere", formula: levetid, id: delta-n, note: "Liten delta: overskuddet som funksjon av tid eller sted." }
  - { tex: "\\Delta n,\\ \\Delta p", meaning: "Startverdien av overskuddet, ved $t = 0$ eller $x = 0$", unit: "cm⁻³", section: "Overskuddsbærere", formula: diffusjonsligning, note: "Stor delta: en konstant, ikke en funksjon." }
  - { tex: "\\tau_n,\\ \\tau_p", meaning: "Levetiden til minoritetsbærere før rekombinasjon", unit: "s", section: "Overskuddsbærere", term: "Levetid", formula: levetid, id: tau-np, note: "$\\tau_n$ gjelder elektroner i p-type, $\\tau_p$ hull i n-type." }
  - { tex: "g_\\text{op}", meaning: "Optisk generasjonsrate", unit: "cm⁻³·s⁻¹", section: "Overskuddsbærere", formula: stasjonaert-overskudd }
  - { tex: "g_i,\\ r_i", meaning: "Termisk generasjons- og rekombinasjonsrate i likevekt", unit: "cm⁻³·s⁻¹", section: "Overskuddsbærere", formula: generasjon-rekombinasjon }
  - { tex: "a_r", meaning: "Rekombinasjonskoeffisienten, $r = a_r np$", unit: "cm³/s", section: "Overskuddsbærere", formula: generasjon-rekombinasjon }
  - { tex: "L_n,\\ L_p", meaning: "Diffusjonslengden, $\\sqrt{D\\tau}$", unit: "cm", section: "Overskuddsbærere", term: "Diffusjonslengde", formula: diffusjonslengde, id: lp, note: "Så langt et overskudd rekker før det har rekombinert til $1/e$." }
  - { tex: "\\alpha", meaning: "Absorpsjonskoeffisienten for lys, intensiteten faller som $e^{-\\alpha x}$", unit: "cm⁻¹", section: "Overskuddsbærere" }
  - { tex: "h\\nu", meaning: "Fotonenergien", unit: "eV", section: "Overskuddsbærere", term: "Elektron-hull-par", note: "Må være minst $E_g$ for å lage et par." }
  # ── pn-overgangen ──
  - { tex: "\\rho(x)", meaning: "Romladningstettheten, $q(p - n + N_d^+ - N_a^-)$", unit: "C/cm³", section: "pn-overgangen", formula: poisson, note: "Ikke resistiviteten $\\rho$." }
  - { tex: "W", meaning: "Bredden av romladningssonen, $x_{p0} + x_{n0}$", unit: "cm", section: "pn-overgangen", term: "Romladningssone", formula: sonebredde, id: w }
  - { tex: "x_{n0},\\ x_{p0}", meaning: "Hvor langt sonen strekker seg inn i n- og p-siden", unit: "cm", section: "pn-overgangen", formula: ladningsbalanse, note: "Lengst inn på den svakest dopede siden." }
  - { tex: "V_0", meaning: "Kontaktpotensialet over sonen i likevekt", unit: "V", section: "pn-overgangen", term: "Kontaktpotensial", formula: kontaktpotensial, id: v0 }
  - { tex: "V", meaning: "Påtrykt spenning over overgangen", unit: "V", section: "pn-overgangen", term: "Forspenning", formula: diodeligning, id: v, note: "Positiv i lederetningen (p-siden høyest). Sperrespenningen skrives $V = -V_r$." }
  - { tex: "\\mathcal{E}_0", meaning: "Det største feltet i sonen, ved skillet $x = 0$", unit: "V/cm", section: "pn-overgangen", formula: maksfelt }
  - { tex: "\\varepsilon", meaning: "Permittiviteten til halvlederen, $\\varepsilon_r\\varepsilon_0$", unit: "F/cm", section: "pn-overgangen", formula: poisson, note: "$\\varepsilon_r = 11{,}8$ for Si." }
  - { tex: "I_0", meaning: "Metningsstrømmen i sperreretningen", unit: "A", section: "pn-overgangen", term: "Metningsstrøm", formula: diodeligning, id: i0 }
  - { tex: "x_n,\\ x_p", meaning: "Avstanden fra sonekanten innover i n- og p-siden", unit: "cm", section: "pn-overgangen", formula: minoritetsprofiler, note: "Måles fra $x_{n0}$ og $-x_{p0}$, ikke fra skillet $x = 0$." }
  - { tex: "\\Delta p_n,\\ \\Delta n_p", meaning: "Overskuddet av minoritetsbærere ved sonekantene", unit: "cm⁻³", section: "pn-overgangen", term: "Injeksjon", formula: injeksjon-kant, note: "Negativt i sperreretningen, ned til $-p_n$ og $-n_p$." }
  - { tex: "Q_p,\\ Q_n", meaning: "Ladningen som er lagret i minoritetsprofilen på n- og p-siden", unit: "C", section: "pn-overgangen", term: "Ladningskontroll", formula: lagret-ladning }
  - { tex: "A", meaning: "Tverrsnittet av overgangen", unit: "cm²", section: "pn-overgangen", formula: metningsstrom-i0 }
  - { tex: "V_\\text{br}", meaning: "Gjennombruddsspenningen", unit: "V", section: "pn-overgangen", term: "Gjennombrudd", formula: skredmultiplikasjon, id: vbr }
  - { tex: "M", meaning: "Multiplikasjonen i skred, bærere ut per bærer inn", section: "pn-overgangen", term: "Skredgjennombrudd", formula: skredmultiplikasjon }
  - { tex: "P", meaning: "Sannsynligheten for en ioniserende kollisjon på én tur gjennom sonen", section: "pn-overgangen", term: "Støtionisasjon", formula: skredmultiplikasjon }
  - { tex: "d", meaning: "Tunnelavstanden mellom båndene i Zener-effekten", unit: "cm", section: "pn-overgangen", term: "Zener-gjennombrudd" }
  - { tex: "i(t),\\ v(t)", meaning: "Strømmen gjennom og spenningen over overgangen under en transient", section: "pn-overgangen", formula: ladning-transient, note: "Små bokstaver for størrelser som endrer seg med tiden." }
  - { tex: "I_f,\\ I_r", meaning: "Strømmen i lederetningen før omslaget og sperrestrømmen etter", unit: "A", section: "pn-overgangen", formula: lagringstid }
  - { tex: "t_{sd}", meaning: "Lagringstiden", unit: "s", section: "pn-overgangen", term: "Lagringstid", formula: lagringstid, id: tsd }
  - { tex: "C_j", meaning: "Overgangskapasitansen, fra ionene i romladningssonen", unit: "F", section: "pn-overgangen", term: "Overgangskapasitans", formula: overgangskapasitans, id: cj }
  - { tex: "C_s", meaning: "Diffusjonskapasitansen, fra den lagrede ladningen", unit: "F", section: "pn-overgangen", term: "Diffusjonskapasitans", formula: diffusjonskapasitans }
  - { tex: "G_s", meaning: "Småsignalkonduktansen, $dI/dV$", unit: "Ω⁻¹", section: "pn-overgangen", formula: smasignalkonduktans }
  - { tex: "c", meaning: "Lengden av den lett dopede siden i en kort diode", unit: "cm", section: "pn-overgangen", term: "Kort diode", formula: diffusjonskapasitans }
  - { tex: "n", meaning: "Idealitetsfaktoren i diodeligningen", section: "pn-overgangen", term: "Idealitetsfaktor", formula: idealitetsfaktor, note: "Ikke elektronkonsentrasjonen $n$. Mellom 1 og 2." }
  - { tex: "V_a", meaning: "Spenningen over hele komponenten", unit: "V", section: "pn-overgangen", formula: seriemotstand, note: "$V$ er den delen som ligger over overgangen." }
  - { tex: "R_p,\\ R_n", meaning: "Motstanden i det nøytrale p- og n-området", unit: "Ω", section: "pn-overgangen", formula: seriemotstand }
  - { tex: "k", meaning: "Gradienten i nettodopingen i en lineært gradvis overgang, $N_d - N_a = kx$", unit: "cm⁻⁴", section: "pn-overgangen", term: "Gradvis overgang", formula: gradvis-overgang, id: k-dopinggradient, note: "Ikke bølgevektoren $k$ eller Boltzmanns konstant $k_B$." }
  # ── Kontakter og heterooverganger ──
  - { tex: "\\Phi_m,\\ \\Phi_s", meaning: "Arbeidsfunksjonen til metallet og halvlederen, som potensial", unit: "V", section: "Kontakter og heterooverganger", term: "Arbeidsfunksjon", formula: schottky-barriere, id: phi-m, note: "$q\\Phi$ er energien i eV. Ikke partikkelfluksen $\\phi$." }
  - { tex: "\\chi", meaning: "Elektronaffiniteten, som potensial", unit: "V", section: "Kontakter og heterooverganger", term: "Elektronaffinitet", formula: arbeidsfunksjon-halvleder, note: "$q\\chi = 4{,}05$ eV for Si." }
  - { tex: "\\Phi_B", meaning: "Barrierehøyden for elektroner fra metallet inn i halvlederen", unit: "V", section: "Kontakter og heterooverganger", term: "Barrierehøyde", formula: schottky-barriere, id: phi-b }
  - { tex: "E_\\text{vac}", meaning: "Vakuumnivået", unit: "eV", section: "Kontakter og heterooverganger", term: "Vakuumnivå" }
  - { tex: "E_{Fm},\\ E_{Fs}", meaning: "Fermi-nivået i metallet og i halvlederen", unit: "eV", section: "Kontakter og heterooverganger", note: "Like i likevekt; med spenningen $V$ ligger de $qV$ fra hverandre." }
  - { tex: "B", meaning: "Konstanten i strømmen over en Schottky-barriere, en effektiv Richardson-konstant", unit: "A/cm²·K²", section: "Kontakter og heterooverganger", formula: schottky-termionisk, note: "Ikke den magnetiske flukstettheten $\\mathcal{B}$." }
  - { tex: "\\Delta E_c,\\ \\Delta E_v", meaning: "Spranget i ledningsbåndet og valensbåndet ved en heteroovergang", unit: "eV", section: "Kontakter og heterooverganger", term: "Heteroovergang", formula: heteroovergang-sprang, note: "Til sammen $\\Delta E_g = E_{g1} - E_{g2}$." }
  - { tex: "V_{01},\\ V_{02}", meaning: "Delen av kontaktpotensialet som ligger på side 1 og side 2 av en heteroovergang", unit: "V", section: "Kontakter og heterooverganger", formula: hetero-spenningsdeling }
  # ── Konstanter ──
  - { tex: "q", meaning: "Elementærladningen", unit: "C", section: "Konstanter", note: "$1{,}602 \\times 10^{-19}$ C. Elektronet har ladning $-q$, hullet $+q$." }
  - { tex: "k_B", meaning: "Boltzmanns konstant", unit: "eV/K", section: "Konstanter", note: "$8{,}62 \\times 10^{-5}$ eV/K." }
  - { tex: "k_BT", meaning: "Termisk energi", unit: "eV", section: "Konstanter", formula: fermi-dirac, id: kbt, note: "$0{,}0259$ eV ved 300 K; $k_BT/q = 0{,}0259$ V." }
  - { tex: "\\hbar", meaning: "Redusert Plancks konstant, $h/2\\pi$", unit: "eV·s", section: "Konstanter", note: "$6{,}58 \\times 10^{-16}$ eV·s; $h = 4{,}14 \\times 10^{-15}$ eV·s." }
  - { tex: "\\varepsilon_0", meaning: "Permittiviteten i vakuum", unit: "F/cm", section: "Konstanter", note: "$8{,}85 \\times 10^{-14}$ F/cm." }
  - { tex: "m_0", meaning: "Elektronets hvilemasse", unit: "kg", section: "Konstanter", note: "$9{,}11 \\times 10^{-31}$ kg. Effektive masser oppgis som brøkdeler av den." }
  - { tex: "a_0", meaning: "Bohr-radien", unit: "Å", section: "Konstanter", formula: hydrogenlik-donor, note: "$0{,}529$ Å." }
