# Formelsamlingen. `onSheet` følger det offisielle formelarket til eksamen
# («Formula sheet for the exam» i Blackboard-rommet, «Formulas TFE-4146», 4 sider,
# vendret som public/formelark.pdf): true bare når formelen står på arket.
# Formler med `onSheet: false` får merket «Ikke på formelarket». Sjekk flaggene
# igjen hvis arket endres.
formulas:
  - id: bloch-funksjon
    section: Fra bindinger til bånd
    onSheet: false
    tex: "\\psi_k(x) = U(k_x, x)\\, e^{jk_x x}"
    label: "Bloch-funksjonen består av to faktorer. $e^{jk_x x}$ er en planbølge, og $U(k_x, x)$ er en funksjon som gjentar seg med gitterets periode, $U(k_x, x + a) = U(k_x, x)$. Elektronet i krystallen er ikke fritt, og beskrives likevel av én bølgevektor $k$."
  - id: gruppehastighet
    section: Hvorfor et fullt bånd ikke leder
    onSheet: false
    tex: "v = \\dfrac{1}{\\hbar}\\dfrac{dE}{dk}"
    label: "Bærerens hastighet er gruppehastigheten til bølgepakken, altså stigningstallet i $E(k)$. På bunnen av båndet er $v = 0$ selv om $\\hbar k \\neq 0$."
  - id: planck
    section: Lys eller varme
    onSheet: true
    tex: "E = h\\nu = \\hbar\\omega"
    label: "Energien til et foton med frekvens $\\nu$. Et elektron som faller fra ledningsbåndet til valensbåndet i en direkte halvleder, sender ut et foton med $h\\nu \\approx E_g$."
  - id: bevegelsesmengde
    section: Effektiv masse
    onSheet: true
    tex: "p = m^*v = \\hbar k = \\dfrac{h}{\\lambda}"
    label: "Bevegelsesmengden til elektronet, med bølgelengden $\\lambda = 2\\pi/k$ (de Broglie). Med den effektive massen gjelder $m^*v = \\hbar k$ nær bunnen av et parabolsk bånd. $\\hbar k$ er krystallmomentum, som bare den ytre kraften endrer."
  - id: krystallmomentum
    section: Hvorfor et fullt bånd ikke leder
    onSheet: false
    tex: "F_\\text{ytre} = \\dfrac{d(\\hbar k)}{dt}"
    label: "Akselerasjonsteoremet. Bare den <em>ytre</em> kraften står på høyresiden, for gitterkreftene ligger allerede inne i formen på $E(k)$. Derfor er $\\hbar k$ krystallmomentum og ikke elektronets ekte bevegelsesmengde."
  - id: effektiv-masse
    section: Effektiv masse
    onSheet: true
    tex: "m^* = \\dfrac{\\hbar^2}{d^2E/dk^2}"
    label: "Effektiv masse fra krumningen til båndet: tallet $m^*$ som må stå i Newtons lov for at den ytre kraften alene skal gi riktig akselerasjon, siden gitterkreftene allerede ligger i tallet. Skarp krumning gir liten $m^*$, flatt bånd gir stor. På valensbåndtoppen er krumningen negativ, og derfor regner du med hull der."
  - id: parabolsk-band
    section: Effektiv masse
    onSheet: true
    tex: "E = \\tfrac{1}{2}m^*v^2 = \\dfrac{1}{2}\\dfrac{p^2}{m^*} = \\dfrac{\\hbar^2}{2m^*}k^2"
    label: "Den kinetiske energien til et elektron nær et båndminimum, målt fra båndkanten. Båndet er da parabolsk, og $m^*$ er <em>konstant</em>; høyere opp i båndet holder ikke tilnærmingen."
  - id: total-energi
    section: Effektiv masse
    onSheet: true
    tex: "E_\\text{tot} = E_\\text{pot} + E_\\text{kin} = E_c + E(k)"
    label: "Elektronets totale energi i ledningsbåndet: båndkanten $E_c$ er den potensielle energien, og $E(k)$ over kanten er den kinetiske. Derfor skråner båndkantene i et felt, mens $E(k)$ beskriver bevegelsen."
  - id: fullt-band-strom
    section: Hvorfor et fullt bånd ikke leder
    onSheet: false
    tex: "J = (-q)\\sum_{i=1}^{N} v_i = 0 \\quad\\Longrightarrow\\quad J = (-q)\\sum_{i=1}^{N} v_i - (-q)v_j = +q\\,v_j"
    label: "Et fullt bånd gir null strøm. Fjerner du elektron $j$, blir summen $+qv_j$, altså <em>nøyaktig</em> strømmen fra én positiv ladning med det manglende elektronets hastighet. Derfor regnes den tomme tilstanden som en positiv ladning, et hull."
  - id: generasjon-rekombinasjon
    section: Elektronene i en silisiumkrystall
    onSheet: false
    tex: "r_i = a_r n_0 p_0 = g_i"
    label: "Likevekt er <em>dynamisk</em>: rekombinasjonsraten $r_i$ er proporsjonal med produktet $n_0p_0$, fordi et elektron og et hull må møtes, og den balanserer generasjonsraten $g_i$. $g_i$ avhenger bare av temperaturen, og i intrinsisk materiale er $g_i = a_rn_i^2$, så produktet er låst: $n_0p_0 = n_i^2$."
  - id: hydrogenlik-donor
    section: Doping
    onSheet: false
    tex: "E_d = 13{,}6\\ \\text{eV}\\cdot\\dfrac{m_n^*/m_0}{\\varepsilon_r^2}, \\qquad a^* = a_0\\,\\dfrac{\\varepsilon_r}{m_n^*/m_0}"
    label: "Hydrogenatomets egne resultater med to bytter: lettere elektron ($m_n^*$) og skjermet Coulomb-kraft ($\\varepsilon_r$). Med $a_0 = 0{,}529$ Å gir det $25$ meV og $24$ Å for Si. Anslaget ligger konsekvent under det målte, fordi elektronet nær kjernen verken ser full $\\varepsilon_r$ eller én isotrop masse."
  - id: tilstandstetthet
    section: Tilstandene i et bånd
    onSheet: false
    tex: "N(E) = 4\\pi\\left(\\dfrac{2m_n^*}{h^2}\\right)^{3/2}\\sqrt{E - E_c}"
    label: "Tilstandstettheten nær bunnen av ledningsbåndet, tilstander per volum og energi. De tillatte $\\vec k$ ligger jevnt i $k$-rommet, og energien vokser som $k^2$, så antallet per energi vokser som $\\sqrt{E - E_c}$. I valensbåndet er det $\\sqrt{E_v - E}$ med $m_p^*$."
  - id: fermi-dirac
    section: Sannsynligheten for at en tilstand er fylt
    onSheet: true
    tex: "\\begin{aligned} f(E) &= \\dfrac{1}{e^{(E - E_F)/k_BT} + 1} \\\\ &\\cong e^{(E_F - E)/k_BT} \\quad \\text{for } E \\gg E_F \\end{aligned}"
    label: "Sannsynligheten for at en tilstand med energien $E$ er fylt ved termisk likevekt. $f(E_F) = \\tfrac{1}{2}$, og fordelingen er symmetrisk om nivået: $f(E_F + \\Delta E) = 1 - f(E_F - \\Delta E)$. Mer enn omtrent $3k_BT$ over $E_F$ blir den en Boltzmann-hale med under 5 % feil, og halen gir eksponentialene i $n_0$. Ved 300 K er $k_BT = 0{,}0259$ eV."
  - id: likevektskonsentrasjoner
    section: Konsentrasjonene
    onSheet: true
    tex: "\\begin{aligned} n_0 &= \\int_{E_c}^{\\infty} f(E)N(E)\\,dE \\\\ &= N_c f(E_c) = N_c\\, e^{-(E_c - E_F)/k_BT} \\\\ p_0 &= N_v[1 - f(E_v)] = N_v\\, e^{-(E_F - E_v)/k_BT} \\end{aligned}"
    label: "Likevektskonsentrasjonene: tilstandstettheten $N(E)$ ganger sannsynligheten for at tilstanden er fylt, summert over båndet. Hull er tomme tilstander, derav $1 - f$. Eksponentialene gjelder når $E_F$ ligger mer enn omtrent $3k_BT$ fra båndkantene (Boltzmann-tilnærmingen). Avstanden fra $E_F$ til kanten står i eksponenten: 60 meV per tierpotens ved romtemperatur."
  - id: effektiv-tilstandstetthet
    section: Konsentrasjonene
    onSheet: true
    tex: "\\begin{aligned} N_c &= 2\\left(\\dfrac{2\\pi m_n^* k_BT}{h^2}\\right)^{3/2} \\\\ N_v &= 2\\left(\\dfrac{2\\pi m_p^* k_BT}{h^2}\\right)^{3/2} \\end{aligned}"
    label: "Effektiv tilstandstetthet: hele ledningsbåndet regnet som $N_c$ tilstander lagt på $E_c$, slik at $n_0 = N_c f(E_c)$. For Si ved 300 K er $N_c \\approx 2{,}9 \\times 10^{19}$ cm⁻³ og $N_v \\approx 1{,}0 \\times 10^{19}$ cm⁻³; begge vokser som $T^{3/2}$."
  - id: massevirkningsloven
    section: Massevirkningsloven
    onSheet: true
    tex: "n_0 p_0 = n_i^2"
    label: "Ved termisk likevekt er produktet låst av materialet og temperaturen, uansett doping: dobler dopingen $n_0$, halveres $p_0$. Samme innhold som ratebalansen $r_i = a_r n_0 p_0 = g_i$, siden generasjonen bare avhenger av temperaturen. Gjelder så lenge Boltzmann-tilnærmingen holder for begge bærertypene."
  - id: intrinsisk-konsentrasjon
    section: Massevirkningsloven
    onSheet: true
    tex: "\\begin{aligned} n_i &= \\sqrt{N_c N_v}\\; e^{-E_g/2k_BT} \\\\ &= 2\\left(\\dfrac{2\\pi k_BT}{h^2}\\right)^{3/2}(m_n^*m_p^*)^{3/4}\\, e^{-E_g/2k_BT} \\end{aligned}"
    label: "Intrinsisk konsentrasjon, med halve gapet i eksponenten fordi $E_F$ ligger nær midten av det. For Si ved 300 K er $n_i = 1{,}5 \\times 10^{10}$ cm⁻³. Eksponenten dominerer temperaturavhengigheten; $T^{3/2}$-faktorene fra $N_c$ og $N_v$ synes knapt ved siden av."
  - id: ni-formene
    section: Fermi-nivået målt fra det intrinsiske nivået
    onSheet: true
    tex: "\\begin{aligned} n_0 &= n_i\\, e^{(E_F - E_i)/k_BT} \\\\ p_0 &= n_i\\, e^{(E_i - E_F)/k_BT} \\end{aligned}"
    label: "Likevektskonsentrasjonene målt fra det intrinsiske nivået $E_i$. Står $E_F$ på $E_i$, er $n_0 = p_0 = n_i$, og fra avstanden $E_F - E_i$ leser du direkte hvor sterkt dopet materialet er."
  - id: intrinsisk-niva
    section: Fermi-nivået målt fra det intrinsiske nivået
    onSheet: true
    tex: "\\begin{aligned} n_i &= N_c\\, e^{-(E_c - E_i)/k_BT} \\\\ p_i &= N_v\\, e^{-(E_i - E_v)/k_BT} \\end{aligned}"
    label: "Likevektsuttrykkene i udopet materiale, der Fermi-nivået er det intrinsiske nivået $E_i$ og $n_i = p_i$. Ganget sammen gir de $n_i = \\sqrt{N_cN_v}\\,e^{-E_g/2k_BT}$; satt like viser de at $E_i$ ligger litt fra midten av gapet når $N_c \\neq N_v$."
  - id: intrinsisk-niva-plassering
    section: Fermi-nivået målt fra det intrinsiske nivået
    onSheet: false
    tex: "E_i = \\dfrac{E_c + E_v}{2} - \\dfrac{k_BT}{2}\\ln\\dfrac{N_c}{N_v} \\allowbreak = \\dfrac{E_c + E_v}{2} - \\dfrac34 k_BT\\ln\\dfrac{m_n^*}{m_p^*}"
    label: "Hvor det intrinsiske nivået ligger, fra $n_0 = p_0$. Med $N_c > N_v$ står det litt under midten av gapet, så elektronene ikke blir flere enn hullene. Midt i gapet bare når $N_c = N_v$; i Si 13 meV under midten ved 300 K."
  - id: dos-masse
    section: Effektiv masse for tilstandstetthet
    onSheet: false
    tex: "(m_n^*)^{3/2} = 6\\,(m_l\\, m_t^2)^{1/2}"
    label: "Effektiv masse for tilstandstetthet i Si: geometrisk middel av krumningsmassene i én dal, ganget opp med de seks dalene. Med $m_l = 0{,}98\\,m_0$ og $m_t = 0{,}19\\,m_0$ gir det $m_n^* = 1{,}1\\,m_0$, tallet som hører hjemme i $N_c$."
  - id: ladningsnoytralitet
    section: Donorer og akseptorer i samme materiale
    onSheet: false
    tex: "p_0 + N_d^+ = n_0 + N_a^-"
    label: "Ladningsnøytralitet: summen av positiv ladning (hull og ioniserte donorer) er lik summen av negativ (elektroner og ioniserte akseptorer). Sammen med $n_0 p_0 = n_i^2$ bestemmer kravet $n_0$, $p_0$ og $E_F$ entydig."
  - id: mobilitet
    section: Drift
    onSheet: true
    tex: "\\mu \\equiv \\dfrac{q\\bar{t}}{m^*}"
    label: "Mobiliteten, drifthastigheten per felt. Feltet gir bæreren bevegelsesmengde, og kollisjonene, i snitt én per $\\bar{t}$, tar den bort igjen. Enheten er cm²/V·s, og mobiliteten er positiv for begge bærertypene. I rent Si ved 300 K er $\\mu_n = 1350$ og $\\mu_p = 480$ cm²/V·s."
  - id: drifthastighet
    section: Drift
    onSheet: false
    tex: "\\langle v_x\\rangle = -\\dfrac{q\\bar{t}}{m_n^*}\\,\\mathcal{E}_x = -\\mu_n\\mathcal{E}_x"
    label: "Drifthastigheten til elektronene, mot feltet. Hullene driver med feltet, $\\langle v_x\\rangle = +\\mu_p\\mathcal{E}_x$."
  - id: metningshastighet
    section: Sterke felt
    onSheet: true
    tex: "v_d \\cong \\dfrac{\\mu\\mathcal{E}}{1 + \\mu\\mathcal{E}/v_s} \\begin{cases} = \\mu\\mathcal{E} & \\text{lave felt, ohmsk} \\\\ = v_s & \\text{høye felt, mettet} \\end{cases}"
    label: "Drifthastigheten over hele feltområdet. Ved lave felt er den proporsjonal med feltet, og Ohms lov gjelder. I Si bøyer den av over omtrent $10^3$ V/cm og flater ut ved metningshastigheten $v_s \\approx 10^7$ cm/s, av samme størrelsesorden som den termiske farten. Raske elektroner spres oftere mot gittersvingningene, så $\\bar{t}$ blir kortere jo sterkere feltet er, og energien feltet tilfører, går til gitteret i stedet for til raskere drift."
  - id: ledningsevne
    section: Strømmen
    onSheet: true
    tex: "\\dfrac{I_x}{A} = J_x = q\\,(n\\mu_n + p\\mu_p)\\,\\mathcal{E}_x = \\sigma\\,\\mathcal{E}_x"
    label: "Driftstrømmen, med ledningsevnen skrevet ut i bærerkonsentrasjoner og mobiliteter. Elektronene driver mot feltet og hullene med det, men begge gir strøm <em>langs</em> feltet, siden ladningene har motsatt fortegn."
  - id: resistans
    section: Strømmen
    onSheet: false
    tex: "\\rho = \\dfrac{1}{\\sigma}, \\qquad R = \\rho\\,\\dfrac{L}{A}"
    label: "Resistiviteten $\\rho$ er i Ω·cm, og en stav med lengde $L$ og tverrsnitt $A$ har resistansen $R$. For en stav med bredde $w$ og tykkelse $t$ er $A = wt$."
  - id: konduktivitetsmasse
    section: Massen i et felt
    onSheet: false
    tex: "\\dfrac{1}{m_n^*} = \\dfrac{1}{3}\\left(\\dfrac{1}{m_l} + \\dfrac{2}{m_t}\\right)"
    label: "Effektiv masse for ledningsevne i Si. Massen står i nevneren i $\\mu_n$, så de inverse massene langs feltet midles over de seks dalene: to med $m_l$ og fire med $m_t$. Med $m_l = 0{,}98\\,m_0$ og $m_t = 0{,}19\\,m_0$ gir det $0{,}26\\,m_0$, mot $1{,}1\\,m_0$ for telling av tilstander. I GaAs er dalen kuleformet, og begge massene er $0{,}067\\,m_0$."
  - id: matthiessen
    section: Det som sprer bærerne
    onSheet: false
    tex: "\\dfrac{1}{\\mu} = \\dfrac{1}{\\mu_\\text{gitter}} + \\dfrac{1}{\\mu_\\text{ioner}}, \\qquad \\mu_\\text{gitter} \\sim T^{-3/2}, \\quad \\mu_\\text{ioner} \\sim T^{3/2}"
    label: "Spredningssannsynlighetene legges sammen, så de inverse mobilitetene legges sammen, og den laveste mobiliteten bestemmer mest. Gittersvingningene sprer mest når krystallen er varm, ionene mest når elektronene er langsomme. $10^{17}$ donorer per cm³ senker $\\mu_n$ i Si fra 1350 til 700 cm²/V·s ved 300 K."
  - id: hall-konsentrasjon
    section: Hall-effekten
    onSheet: false
    tex: "p = \\dfrac{I_x\\mathcal{B}_z}{qtV_{AB}}, \\qquad \\mu_p = \\dfrac{1}{qp\\rho}"
    label: "Hullkonsentrasjonen fra Hall-spenningen $V_{AB}$ over en stav med tykkelse $t$, og mobiliteten fra den og resistiviteten. Magnetfeltet presser bærerne mot den ene kanten til feltet på tvers, $\\mathcal{E}_y = v_x\\mathcal{B}_z$, holder igjen. Færre bærere driver fortere og gir større spenning. For elektroner er $V_{AB}$ negativ, og $n = I_x\\mathcal{B}_z/qt(-V_{AB})$."
  - id: fermi-flat
    section: Fermi-nivået i likevekt
    onSheet: false
    tex: "\\dfrac{dE_F}{dx} = 0"
    label: "Fermi-nivået er det samme overalt i materialer i kontakt ved termisk likevekt. Raten $N_1 f_1 \\cdot N_2(1 - f_2)$ fra 1 til 2 må være lik raten tilbake ved hver energi, og det krever $f_1 = f_2$, altså $E_{F1} = E_{F2}$."
  - id: absorpsjon
    section: Lys lager elektron-hull-par
    onSheet: false
    tex: "I(x) = I(0)\\,e^{-\\alpha x}"
    label: "Intensiteten av lys med $h\\nu \\ge E_g$ i dybden $x$. Et foton som har kommet til $x$, har den samme sjansen for å bli absorbert i det neste stykket, så andelen per lengde, absorpsjonskoeffisienten $\\alpha$, er konstant. Parene lages innenfor omtrent $1/\\alpha$ fra overflaten, noen få mikrometer for rødt lys i Si."
  - id: levetid
    section: Rekombinasjon og levetid
    onSheet: false
    tex: "\\delta p(t) = \\Delta p\\,e^{-t/\\tau_p}, \\qquad \\tau_p = \\dfrac{1}{a_r(n_0 + p_0)} \\approx \\dfrac{1}{a_r n_0}"
    label: "Overskuddet av hull i n-type etter et glimt, ved lav injeksjon og direkte rekombinasjon. Hvert hull har den samme sjansen per sekund for å bli fylt, fordi $n \\approx n_0$, så overskuddet dør ut eksponentielt. Elektronene i overskuddet forsvinner like fort, parvis med hullene. I p-type er $\\tau_n \\approx 1/a_rp_0$. I Si går rekombinasjonen via sentre i gapet, og levetiden er satt av hvor mange sentre det er."
  - id: stasjonaert-overskudd
    section: Jevnt lys og kvasi-Fermi-nivåer
    onSheet: false
    tex: "\\delta n = \\delta p = g_\\text{op}\\,\\tau_p"
    label: "Det stasjonære overskuddet under jevnt lys, ved lav injeksjon: lyset lager $g_\\text{op}$ par per cm³ og sekund, og hvert lever $\\tau_p$. Da er $np \\neq n_i^2$, og ett Fermi-nivå kan ikke gi både $n$ og $p$."
  - id: kvasi-fermi-nivaaer
    section: Jevnt lys og kvasi-Fermi-nivåer
    onSheet: true
    tex: "\\begin{aligned} n &= N_c\\, e^{-(E_c - F_n)/k_BT} = n_i\\, e^{(F_n - E_i)/k_BT} \\\\ p &= N_v\\, e^{-(F_p - E_v)/k_BT} = n_i\\, e^{(E_i - F_p)/k_BT} \\end{aligned}"
    label: "Kvasi-Fermi-nivåene $F_n$ og $F_p$: samme form som likevektsuttrykkene, med hvert sitt nivå. Inne i et bånd fordeler bærerne seg på pikosekunder, mellom båndene tar det mikrosekunder, så under lys har hvert bånd sitt eget nivå. I likevekt er $F_n = F_p = E_F$. Minoritetsnivået flytter seg mest, $k_BT$ for hver faktor $e$ konsentrasjonen endrer seg med."
  - id: diffusjonsstrom
    section: Diffusjon
    onSheet: true
    tex: "J_n^\\text{diff}(x) = +qD_n\\dfrac{dn(x)}{dx}, \\qquad J_p^\\text{diff}(x) = -qD_p\\dfrac{dp(x)}{dx}"
    label: "Diffusjonsstrømmene, fra fluksen $\\phi = -D\\,dn/dx$ ganger ladningen. Elektroner og hull i samme gradient går samme vei, men strømmene deres går motsatt vei. For Si er $D_n = 35$ og $D_p = 12{,}5$ cm²/s."
  - id: diffusjonskoeffisient
    section: Diffusjon
    onSheet: false
    tex: "D = \\dfrac{l^2}{2\\bar{t}}"
    label: "Diffusjonskoeffisienten i modellen der hver bærer tar ett steg $l$ til venstre eller høyre hver midlere kollisjonstid $\\bar{t}$. Halvparten av bærerne innenfor ett steg på hver side av et snitt går over, så fluksen er $(l/2\\bar{t})(n_1 - n_2) = -D\\,dn/dx$. Modellen er grov: for elektroner i Si gir den omtrent 50 cm²/s, mot målte 35. Med flukter i alle retninger og ulike lengder blir $D = l^2/3\\bar{t} \\approx 34$ cm²/s."
  - id: driftdiffusjonsstrom
    section: Drift og diffusjon sammen
    onSheet: true
    tex: "\\begin{aligned} J_n(x) &= q\\mu_n n(x)\\mathcal{E}(x) + qD_n\\dfrac{dn(x)}{dx} \\\\ J_p(x) &= q\\mu_p p(x)\\mathcal{E}(x) - qD_p\\dfrac{dp(x)}{dx} \\end{aligned}"
    label: "Strømmen for hver bærertype: et driftledd proporsjonalt med konsentrasjonen og et diffusjonsledd proporsjonalt med gradienten. Minoritetsbærerne bærer lite strøm ved drift, men kan bære mye ved diffusjon, fordi gradienten deres kan være bratt. $J = J_n + J_p$."
  - id: total-strom
    section: Drift og diffusjon sammen
    onSheet: true
    tex: "\\begin{aligned} J_\\text{tot} &= J_\\text{ledning} + J_\\text{forskyvning} \\\\ &= J_n + J_p + C\\dfrac{dV}{dt} \\end{aligned}"
    label: "Den totale strømtettheten: ledningsstrømmen fra bærerne pluss forskyvningsstrømmen når spenningen endrer seg, med $C$ som kapasitansen per areal. I stasjonær tilstand er det siste leddet null."
  - id: felt-baandskjema
    section: Drift og diffusjon sammen
    onSheet: true
    tex: "\\mathcal{E}(x) = -\\dfrac{d\\mathcal{V}(x)}{dx} = \\dfrac{1}{q}\\dfrac{dE_i}{dx}"
    label: "Et felt tegnes som skrå bånd. Båndkanten er elektronets potensielle energi, $E_c = \\text{konstant} - q\\mathcal{V}$, så båndene ligger lavest der potensialet er høyest. Potensialet faller i feltretningen, så båndene stiger i feltretningen, og hellingen er feltet. Elektronene triller nedover i båndskjemaet, hullene flyter oppover, og $\\mathcal{E}$ peker oppover bakken."
  - id: einstein
    section: Innebygd felt og Einstein-relasjonen
    onSheet: true
    tex: "\\dfrac{D}{\\mu} = \\dfrac{k_BT}{q}"
    label: "Einstein-relasjonen. Der dopingen varierer, driver det innebygde feltet bærerne like fort tilbake som de diffunderer, og med $n = N_ce^{-(E_c - E_F)/k_BT}$ og $E_F$ flatt krever $J_n = 0$ dette forholdet. Det er $0{,}0259$ V ved romtemperatur for begge bærertypene, fordi regningen bare bruker at konsentrasjonen endrer seg med en faktor $e$ for hver $k_BT$ båndkanten flytter seg i forhold til $E_F$."
  - id: kontinuitet
    section: Kontinuitetsligningen
    onSheet: true
    tex: "\\begin{aligned} \\dfrac{\\partial p(x,t)}{\\partial t} &= \\dfrac{\\partial\\,\\delta p}{\\partial t} = -\\dfrac{1}{q}\\dfrac{\\partial J_p}{\\partial x} - \\dfrac{\\delta p}{\\tau_p} \\\\ \\dfrac{\\partial\\,\\delta n}{\\partial t} &= \\dfrac{1}{q}\\dfrac{\\partial J_n}{\\partial x} - \\dfrac{\\delta n}{\\tau_n} \\end{aligned}"
    label: "Kontinuitetsligningen: overskuddet i en skive endrer seg med det som strømmer inn, minus det som strømmer ut, minus det som rekombinerer. Fortegnet skifter for elektronene, fordi strømmen deres går motsatt vei av elektronene."
  - id: diffusjonsligning
    section: Kontinuitetsligningen
    onSheet: false
    tex: "\\dfrac{\\partial\\,\\delta p}{\\partial t} = D_p\\dfrac{\\partial^2\\delta p}{\\partial x^2} - \\dfrac{\\delta p}{\\tau_p}"
    label: "Diffusjonsligningen: kontinuitetsligningen med ren diffusjonsstrøm satt inn. Krumningen til profilen jevner den ut, og levetiden tømmer den. For elektronene står $D_n$ og $\\tau_n$."

  - id: stasjonaer-diffusjon
    section: Stasjonær injeksjon og diffusjonslengden
    onSheet: true
    tex: "\\dfrac{d^2\\delta n}{dx^2} = \\dfrac{\\delta n}{D_n\\tau_n} \\equiv \\dfrac{\\delta n}{L_n^2}, \\qquad \\dfrac{d^2\\delta p}{dx^2} = \\dfrac{\\delta p}{L_p^2}"
    label: "Diffusjonsligningen i stasjonær tilstand, uten felt. I en lang stav med overskuddet $\\Delta p$ i enden er løsningen $\\delta p(x) = \\Delta p\\,e^{-x/L_p}$."
  - id: diffusjonslengde
    section: Stasjonær injeksjon og diffusjonslengden
    onSheet: true
    tex: "L \\equiv \\sqrt{D\\tau}"
    label: "Diffusjonslengden, hvor langt en bærer diffunderer på én levetid. Overskuddet har falt til $1/e$ der, og en bærer kommer i gjennomsnitt $L$ inn før den rekombinerer. For hull i Si med $D_p = 12{,}5$ cm²/s og $\\tau_p = 1$ µs er $L_p = 35$ µm."
  - id: injeksjonsstrom
    section: Stasjonær injeksjon og diffusjonslengden
    onSheet: false
    tex: "\\begin{aligned} \\delta p(x) &= \\Delta p\\, e^{-x/L_p} \\\\ J_p(x) &= q\\dfrac{D_p}{L_p}\\,\\delta p(x) \\\\ Q_p &= qA\\,\\Delta p\\,L_p \\end{aligned}"
    label: "Stasjonær injeksjon i en lang stav. Diffusjonsstrømmen fra den eksponentielle profilen er proporsjonal med overskuddet i hvert punkt, og ladningen som er lagret i staven, er arealet under profilen. Strømmen inn er $Q_p/\\tau_p$, fordi rekombinasjonen i staven i stasjonær tilstand må ta like mange hull som strømmer inn. Begge brukes på minoritetsbærerne som sprøytes inn over en pn-overgang, der formelarket skriver dem med $x_n$ og $\\Delta p_n$."
  - id: haynes-shockley
    section: Haynes–Shockley-eksperimentet
    onSheet: false
    tex: "\\begin{aligned} \\mu_p &= \\dfrac{L}{t_d\\,\\mathcal{E}}, \\qquad D_p = \\dfrac{(\\Delta x)^2}{16\\,t_d} \\\\ \\Delta x &= \\dfrac{L}{t_d}\\,\\Delta t \\end{aligned}"
    label: "Haynes–Shockley: en puls av hull i en n-type stav driver avstanden $L$ på tiden $t_d$ i feltet $\\mathcal{E}$, og drifttiden gir minoritetsmobiliteten. Pulsen er gaussisk, $\\delta p \\propto e^{-x^2/4D_pt}$, så bredden $\\Delta x$ mellom $1/e$-punktene gir $D_p$. Oscilloskopet viser bredden i tid, $\\Delta t$, og driftfarten regner den om."
  - id: kontaktpotensial
    section: Båndskjemaet og kontaktpotensialet
    onSheet: true
    tex: "\\begin{aligned} V_0 &= \\dfrac{k_BT}{q}\\ln\\dfrac{p_p}{p_n} = \\dfrac{k_BT}{q}\\ln\\dfrac{N_a}{n_i^2/N_d} \\\\ &= \\dfrac{k_BT}{q}\\ln\\dfrac{N_aN_d}{n_i^2} \\end{aligned}"
    label: "Kontaktpotensialet over romladningssonen i likevekt. Fermi-nivået er flatt, så båndene er skjøvet med summen av avstandene fra $E_i$ til $E_F$ på de to sidene, $k_BT\\ln(N_a/n_i)$ og $k_BT\\ln(N_d/n_i)$. Det vokser bare logaritmisk med dopingen og er typisk 0,6 til 0,9 V for Si ved 300 K. Potensialet er høyest på n-siden. Et voltmeter over dioden viser likevel null, fordi Fermi-nivået er flatt gjennom hele kretsen."
  - id: boltzmann-overgang
    section: Bærerne som krysser overgangen
    onSheet: true
    tex: "\\dfrac{p_p}{p_n} = \\dfrac{n_n}{n_p} = e^{qV_0/k_BT}"
    label: "Forholdet mellom konsentrasjonene på de to sidene, satt av barrieren. Med $E_F$ flatt faller konsentrasjonen med en faktor $e$ for hver $k_BT$ båndkanten ligger høyere, og på p-siden ligger $E_c$ $qV_0$ høyere enn på n-siden. Den andre likheten følger av $p_pn_p = p_nn_n = n_i^2$."
  - id: baandforskyvning
    section: Båndskjemaet og kontaktpotensialet
    onSheet: false
    tex: "\\begin{aligned} qV_0 &= E_{vp} - E_{vn} \\\\ &= (E_{ip} - E_F) \\\\ &\\quad + (E_F - E_{in}) \\end{aligned}"
    label: "Båndene på p-siden ligger $qV_0$ over båndene på n-siden, fordi Fermi-nivået er flatt i likevekt. Båndkanten er $\\text{konstant} - q\\mathcal{V}$, så båndene ligger lavest på n-siden, der potensialet er høyest. Tegn hver side for seg med sitt $E_F$, skyv dem loddrett til Fermi-nivåene faller sammen, og les $qV_0$ som summen av avstandene fra $E_i$ til $E_F$ på de to sidene."
  - id: ladningsbalanse
    section: Ladningen, feltet og bredden
    onSheet: false
    tex: "qA\\,x_{p0}N_a = qA\\,x_{n0}N_d"
    label: "Ladningen i romladningssonen er like stor på begge sider, siden feltlinjene starter på ionene på n-siden og ender på ionene på p-siden. Den lett dopede siden må avdekke en tykkere skive for samme ladning, så sonen ligger mest der."
  - id: poisson
    section: Ladningen, feltet og bredden
    onSheet: true
    tex: "\\begin{aligned} \\dfrac{d\\mathcal{E}(x)}{dx} &= -\\dfrac{d^2\\mathcal{V}(x)}{dx^2} = \\dfrac{\\rho(x)}{\\varepsilon} \\\\ &= \\dfrac{q}{\\varepsilon}\\,(p - n + N_d^+ - N_a^-) \\end{aligned}"
    label: "Poissons ligning. I utarmingstilnærmingen er sonen tom for bærere, så $d\\mathcal{E}/dx = qN_d/\\varepsilon$ for $0 < x < x_{n0}$ og $-qN_a/\\varepsilon$ for $-x_{p0} < x < 0$. Feltet blir en trekant som er null ved begge kantene og negativ i hele sonen, siden det peker fra n mot p."
  - id: maksfelt
    section: Ladningen, feltet og bredden
    onSheet: false
    tex: "\\begin{aligned} \\mathcal{E}_0 &= -\\dfrac{q}{\\varepsilon}N_d\\,x_{n0} = -\\dfrac{q}{\\varepsilon}N_a\\,x_{p0} \\\\ V_0 &= -\\tfrac{1}{2}\\mathcal{E}_0 W \\end{aligned}"
    label: "Det største feltet står ved skillet $x = 0$, der alle feltlinjene passerer, og kontaktpotensialet er arealet av felttrekanten. Med $V_0 = 0{,}8$ V og $W = 0{,}46$ µm er $\\mathcal{E}_0 = -3{,}5 \\times 10^4$ V/cm."
  - id: sonebredde
    section: Ladningen, feltet og bredden
    onSheet: true
    tex: "W = \\left[\\dfrac{2\\varepsilon(V_0 - V)}{q}\\left(\\dfrac{N_a + N_d}{N_aN_d}\\right)\\right]^{1/2}"
    label: "Bredden på romladningssonen, fra felttrekanten og ladningsbalansen. Den lettest dopede siden setter bredden, siden $(N_a + N_d)/N_aN_d = 1/N_a + 1/N_d$. Den vokser som roten av spenningen over sonen: $V_0$ i likevekt, $V_0 - V$ med forspenning, så sonen krymper i lederetningen og vokser i sperreretningen. For Si er den typisk mellom 0,1 og 1 µm."
  - id: ensidig-overgang
    section: Ladningen, feltet og bredden
    onSheet: true
    tex: "\\begin{aligned} x_{n0} &= \\dfrac{WN_a}{N_a + N_d} \\simeq W \\\\ V_0 &= \\dfrac{qN_dW^2}{2\\varepsilon} \\end{aligned}"
    label: "Den ensidige p⁺n-overgangen. Brøken gjelder alltid, og på p-siden er $x_{p0} = WN_d/(N_a + N_d)$. Med $N_a \\gg N_d$ ligger hele sonen på n-siden, og $V_0$ er arealet av felttrekanten med $\\mathcal{E}_0 = -qN_dW/\\varepsilon$."
  - id: diodeligning
    section: Fire strømmer med spenning
    onSheet: true
    tex: "I = I_0\\left(e^{qV/k_BT} - 1\\right)"
    label: "Strømmen gjennom overgangen, positiv fra p til n. Diffusjonsstrømmen over barrieren er likevektsverdien ganger $e^{qV/k_BT}$; generasjonsstrømmen av minoritetsbærere er uavhengig av $V$, og de to er like store i likevekt, så $I_0 = |I_\\text{gen}|$. I lederetningen vokser strømmen med en faktor 10 for hver 60 mV ved romtemperatur, og i sperreretningen er den $-I_0$, metningsstrømmen, uansett spenning."
  - id: injeksjon-kant
    section: Minoritetsbærerne ved kantene
    onSheet: true
    tex: "\\begin{aligned} \\Delta p_n &= p(x_{n0}) - p_n \\\\ &= p_n\\left(e^{qV/k_BT} - 1\\right) \\end{aligned}"
    label: "Overskuddet av hull ved n-kanten av romladningssonen, fra $p(x_{n0})/p_n = e^{qV/k_BT}$ ved lav injeksjon. På p-siden er $\\Delta n_p = n_p(e^{qV/k_BT} - 1)$. Vokser eksponentielt i lederetningen; i sperreretningen med $V_r \\gg k_BT/q$ er $\\Delta p_n \\approx -p_n$ og $\\Delta n_p \\approx -n_p$, så kantene er tømt for minoritetsbærere."
  - id: minoritetsprofiler
    section: Minoritetsbærerne ved kantene
    onSheet: true
    tex: "\\begin{aligned} \\delta p(x_n) &= \\Delta p_n\\, e^{-x_n/L_p} \\\\ &= p_n\\left(e^{qV/k_BT} - 1\\right)e^{-x_n/L_p} \\end{aligned}"
    label: "Profilen av injiserte hull i en lang n-side, med $x_n$ målt fra $x_{n0}$ innover. På p-siden er $\\delta n(x_p) = \\Delta n_p\\,e^{-x_p/L_n}$, med $x_p$ fra $-x_{p0}$ innover. Samme løsning som for injeksjon i enden av en stav, med overskuddet ved kanten satt av spenningen."
  - id: kvasi-fermi-sone
    section: Minoritetsbærerne ved kantene
    onSheet: true
    tex: "np = n_i^2\\, e^{(F_n - F_p)/k_BT}"
    label: "Produktet utenfor likevekt. Inne i romladningssonen ligger kvasi-Fermi-nivåene $qV$ fra hverandre, så $np = n_i^2e^{qV/k_BT}$ der. Utenfor er det minoritetsnivået som flytter seg, lineært med avstanden, til det møter $E_F$ etter mange diffusjonslengder. I sperreretningen er $np \\approx 0$ i sonen."
  - id: metningsstrom-i0
    section: Diodeligningen
    onSheet: true
    tex: "\\begin{aligned} I &= qA\\left(\\dfrac{D_p}{L_p}\\,p_n + \\dfrac{D_n}{L_n}\\,n_p\\right)\\left(e^{qV/k_BT} - 1\\right) \\\\ &= I_0\\left(e^{qV/k_BT} - 1\\right) \\end{aligned}"
    label: "Den ideelle diodeligningen med metningsstrømmen $I_0$ skrevet ut: diffusjonsstrømmene ved de to sonekantene lagt sammen, uten rekombinasjon i sonen. Med $p_n = n_i^2/N_d$ og $n_p = n_i^2/N_a$ er det den lett dopede siden som teller, og i en p⁺n-overgang er strømmen nesten bare hull injisert i n-siden. Siden $D_p/L_p = L_p/\\tau_p$, er $I_0$ lik $q$ ganger antall par som dannes termisk per sekund innenfor en diffusjonslengde fra sonen."
  - id: lagret-ladning
    section: Ladningskontroll
    onSheet: true
    tex: "\\begin{aligned} Q_p &= qA\\int_0^\\infty \\delta p(x_n)\\,dx_n \\\\ &= qA\\,\\Delta p_n\\int_0^\\infty e^{-x_n/L_p}\\,dx_n = qAL_p\\,\\Delta p_n \\end{aligned}"
    label: "Ladningen som er lagret i hullprofilen på n-siden, er arealet under den. Tilsvarende $Q_n = qA\\,L_n\\,\\Delta n_p$ på p-siden."
  - id: ladningskontroll
    section: Ladningskontroll
    onSheet: true
    tex: "\\begin{aligned} I_p(x_n = 0) &= \\dfrac{Q_p}{\\tau_p} = qA\\dfrac{L_p}{\\tau_p}\\,\\Delta p_n \\\\ &= qA\\dfrac{D_p}{L_p}\\,p_n\\left(e^{qV/k_BT} - 1\\right) \\end{aligned}"
    label: "Strømmen inn må fylle opp den lagrede ladningen på hvert $\\tau_p$ sekund. Samme svar som fra gradienten ved sonekanten, siden $L_p/\\tau_p = D_p/L_p$."
  - id: majoritetsstrom
    section: Strømmen langs dioden
    onSheet: false
    tex: "\\begin{aligned} I_p(x_n) &= qA\\dfrac{D_p}{L_p}\\,\\delta p(x_n) \\\\ I_n(x_n) &= I - I_p(x_n) \\end{aligned}"
    label: "Den samlede strømmen er den samme i hvert tverrsnitt. Minoritetsstrømmen er proporsjonal med overskuddet og dør ut som $e^{-x_n/L_p}$ fra sonen, så majoritetsbærerne tar over: elektronene på n-siden erstatter dem som rekombinerer med de injiserte hullene, og leverer dem som injiseres inn i p-siden."
  - id: skredmultiplikasjon
    section: Skredgjennombrudd
    onSheet: false
    tex: "\\begin{aligned} M &= \\dfrac{n_\\text{ut}}{n_\\text{in}} = \\dfrac{1}{1 - P} \\\\ &= 1 + P + P^2 + \\cdots \\\\ M &= \\dfrac{1}{1 - (V/V_\\text{br})^n} \\end{aligned}"
    label: "Multiplikasjonen i skredgjennombrudd, med $P$ som sannsynligheten for en ioniserende kollisjon per tur gjennom sonen. Den nederste er den målte formen nær gjennombrudd, der eksponenten $n$ er et tall mellom 3 og 6, satt av materialet, og ikke en konsentrasjon. $V_\\text{br}$ vokser med båndgapet og faller med dopingen på den lett dopede siden."

  - id: ladning-transient
    section: Ladningen som er lagret
    onSheet: true
    tex: "i(t) = \\dfrac{Q_p(t)}{\\tau_p} + \\dfrac{dQ_p(t)}{dt}"
    label: "Strømmen inn i n-siden av en p⁺n-diode mens strømmen endrer seg: den erstatter hullene som rekombinerer, og bygger opp eller tømmer den lagrede ladningen. Kontinuitetsligningen integrert over n-siden. I stasjonær tilstand står ladningskontroll igjen."
  - id: strom-slatt-av
    section: Når strømmen brytes
    onSheet: false
    tex: "Q_p(t) = I\\tau_p\\,e^{-t/\\tau_p}"
    label: "Strømmen $I$ brytes ved $t = 0$, og den lagrede ladningen dør ut med levetiden, fordi hullene bare kan forsvinne ved å rekombinere. Så lenge den er der, ligger det en spenning over overgangen."
  - id: spenning-slatt-av
    section: Når strømmen brytes
    onSheet: false
    tex: "v(t) = \\tfrac{k_BT}{q}\\ln\\bigl(\\tfrac{I\\tau_p}{qAL_pp_n}e^{-t/\\tau_p} + 1\\bigr)"
    label: "Spenningen over overgangen etter at strømmen er brutt, i den kvasistasjonære tilnærmingen $\\Delta p_n = Q_p/qAL_p$. Den synker med $k_BT/q$ per levetid så lenge argumentet er stort. Kanten tømmes i virkeligheten litt raskere, fordi profilen flater ut der."
  - id: lagringstid
    section: Lagringstiden
    onSheet: false
    tex: "t_{sd} = \\tau_p\\left[\\operatorname{erf}^{-1}\\!\\left(\\dfrac{I_f}{I_f + I_r}\\right)\\right]^2"
    label: "Lagringstiden etter omslag fra $I_f$ i lederetningen til $-I_r$: så lenge har kanten av sonen et overskudd, spenningen over overgangen er liten, og motstanden setter strømmen. Eksakt løsning av diffusjonsligningen. Med $I_r = I_f$ er $t_{sd} = 0{,}23\\,\\tau_p$. Snudd gir den levetiden fra en måling av $t_{sd}$. Ladningen i sonen forlenger strømmen når den ikke er liten mot $I_rt_{sd}$."
  - id: lagringstid-kvasistasjonar
    section: Lagringstiden
    onSheet: false
    tex: "Q_p(t) = -I_r\\tau_p \\allowbreak + (I_f + I_r)\\,\\tau_p\\,e^{-t/\\tau_p} \\allowbreak\\quad t_{sd} = \\tau_p\\ln\\!\\left(1 + \\dfrac{I_f}{I_r}\\right)"
    label: "Ladningen etter omslaget er eksakt. Lagringstiden $t_{sd} = \\tau_p\\ln(1 + I_f/I_r)$ er den kvasistasjonære tilnærmingen, der kanten er tom først når $Q_p = 0$. Den er for lang, tre ganger for lang med $I_r = I_f$, fordi kanten i virkeligheten tømmes mens det ligger hull lenger inne."
  - id: kapasitans
    section: Dioden som kondensator
    onSheet: true
    tex: "C = \\left|\\dfrac{dQ}{dV}\\right|"
    label: "Kapasitansen når ladningen ikke er proporsjonal med spenningen: hvor mye ladning som flytter seg per volt rundt spenningen dioden står på. Gjelder både ionene i romladningssonen og de lagrede minoritetsbærerne."
  - id: overgangskapasitans
    section: Overgangskapasitansen
    onSheet: true
    tex: "\\begin{aligned} C_j &= \\varepsilon A\\left[\\dfrac{q}{2\\varepsilon(V_0 - V)}\\,\\dfrac{N_dN_a}{N_d + N_a}\\right]^{1/2} \\\\ &= \\dfrac{\\varepsilon A}{W} \\end{aligned}"
    label: "Kapasitansen fra ionene i romladningssonen. Ladningen som kommer til når spenningen endrer seg, sitter ved kantene av sonen, så den er kapasitansen til en platekondensator med avstanden $W$. Dominerer i sperreretningen. Går som $V_r^{-1/2}$ i en abrupt overgang og $V_r^{-1/3}$ i en lineært gradvis."
  - id: overgangskapasitans-ensidig
    section: Overgangskapasitansen
    onSheet: false
    tex: "C_j = \\varepsilon A\\left[\\dfrac{qN_d}{2\\varepsilon(V_0 - V)}\\right]^{1/2}"
    label: "Overgangskapasitansen i en p⁺n-overgang, der sonen ligger nesten bare på n-siden. Målt ved en sperrespenning som er stor mot $V_0$, og med kjent areal, gir den dopingen $N_d$."
  - id: diffusjonskapasitans
    section: Diffusjonskapasitansen
    onSheet: false
    tex: "C_s = \\tfrac{2}{3}\\,\\dfrac{dQ_p}{dV} = \\dfrac{1}{3}\\,\\dfrac{q^2}{k_BT}\\,Alp_n\\,e^{qV/k_BT}"
    label: "Diffusjonskapasitansen fra hullene i en kort diode med n-siden $l$ lang: to tredjedeler av endringen i den lagrede ladningen kommer tilbake ut over kanten av sonen, resten går ut gjennom kontakten. Her er $dQ_p/dV = (q/k_BT)Q_p$. Vokser som $e^{qV/k_BT}$ og dominerer ved store strømmer i lederetningen."
  - id: smasignalkonduktans
    section: Diffusjonskapasitansen
    onSheet: true
    tex: "\\begin{aligned} G_s &= \\dfrac{dI}{dV} = \\dfrac{qAL_pp_n}{\\tau_p}\\dfrac{d}{dV}\\left(e^{qV/k_BT}\\right) \\\\ &= \\dfrac{q}{k_BT}\\,I \\end{aligned}"
    label: "Småsignalkonduktansen til en lang diode i lederetningen: hvor mye strømmen endrer seg for en liten endring i spenningen rundt arbeidspunktet. Ved 1 mA er $1/G_s = 26$ Ω."
  - id: gradvis-overgang
    section: Gradvise overganger
    onSheet: false
    tex: "\\begin{aligned} W &= \\left[\\dfrac{12\\varepsilon(V_0 - V)}{qk}\\right]^{1/3} \\\\ \\mathcal{E}(x) &= \\dfrac{qk}{2\\varepsilon}\\Big(x^2 - \\dfrac{W^2}{4}\\Big) \\end{aligned}"
    label: "Den lineært gradvise overgangen, med nettodopingen $N_d - N_a = kx$ gjennom sonen og $x$ målt fra skillet. Sonen ligger symmetrisk om skillet, feltet er en parabel med det største feltet $\\mathcal{E}_0 = -qkW^2/8\\varepsilon$ ved skillet, og $C_j = \\varepsilon A/W \\propto (V_0 - V)^{-1/3}$."
  - id: idealitetsfaktor
    section: Rekombinasjon og generasjon i sonen
    onSheet: true
    tex: "\\begin{aligned} I &= I_0'\\left(e^{qV/nk_BT} - 1\\right) \\\\ n &= 1 \\text{ til } 2 \\end{aligned}"
    label: "Diodeligningen med idealitetsfaktoren $n$, som ikke er elektronkonsentrasjonen. Diffusjon fra de nøytrale områdene går som $n_i^2e^{qV/k_BT}$ og gir $n = 1$. Rekombinasjon i sonen går som $n_ie^{qV/2k_BT}$, fordi den går raskest der $n = p$, og gir $n = 2$. I Si går $n$ fra omtrent 2 ved små spenninger mot 1."
  - id: hoy-injeksjon
    section: Høy injeksjon og motstand
    onSheet: false
    tex: "\\Delta p_n = n_i\\,e^{qV/2k_BT} \\allowbreak\\quad I \\propto e^{qV/2k_BT}"
    label: "Høy injeksjon på den lett dopede n-siden av en p⁺n-overgang: overskuddet er mye større enn $N_d$, og like mange elektroner følger med, så $pn = n_i^2e^{qV/k_BT}$ ved kanten gir $\\Delta p_n^2 = n_i^2e^{qV/k_BT}$. Strømmen vokser med halve eksponenten."
  - id: seriemotstand
    section: Høy injeksjon og motstand
    onSheet: false
    tex: "V = V_a - I\\,(R_p + R_n)"
    label: "Spenningen over overgangen når de nøytrale områdene tar sin del av spenningen $V_a$ over hele dioden. Merkes ved store strømmer, der strømmen til slutt vokser nesten lineært."
  - id: strom-bandgap
    section: Båndgapet og spenningen dioden trenger
    onSheet: false
    tex: "I = qA\\dfrac{D_p}{L_p}\\,N_v\\,e^{[qV - (E_F - E_v)]/k_BT}"
    label: "Diodeligningen for en p⁺n-overgang i lederetningen med $p_n$ skrevet ut, der $E_F - E_v$ gjelder n-siden. Strømmen blir merkbar først når $qV$ nærmer seg $E_F - E_v \\approx qV_0$, som er nær $E_g$ når begge sidene er sterkt dopet."

  - id: arbeidsfunksjon-halvleder
    section: Arbeidsfunksjon og elektronaffinitet
    onSheet: false
    tex: "q\\Phi_s = q\\chi + (E_c - E_F)"
    label: "Arbeidsfunksjonen til en halvleder, fra Fermi-nivået opp til vakuumnivået. Elektronaffiniteten $q\\chi$ er fast for materialet, $4{,}05$ eV for Si, mens $E_c - E_F$ og dermed $\\Phi_s$ avhenger av dopingen."
  - id: schottky-barriere
    section: Schottky-kontakten
    onSheet: false
    tex: "\\begin{aligned} V_0 &= \\Phi_m - \\Phi_s \\\\ \\Phi_B &= \\Phi_m - \\chi \\end{aligned}"
    label: "Kontaktpotensialet og barrierehøyden i en Schottky-kontakt på n-type, der $\\Phi_m > \\Phi_s$ og halvlederen tømmes nær grenseflaten. $V_0$ holder elektronene i halvlederen tilbake og blir $V_0 - V$ med spenning; $\\Phi_B$ er barrieren for elektronene i metallet og endres ikke av spenningen i en ideell kontakt. På p-type kreves $\\Phi_m < \\Phi_s$, og $V_0 = \\Phi_s - \\Phi_m$."
  - id: schottky-sonebredde
    section: Schottky-kontakten
    onSheet: false
    tex: "W = \\left[\\dfrac{2\\varepsilon(V_0 - V)}{qN_d}\\right]^{1/2}"
    label: "Bredden av romladningssonen i en Schottky-kontakt på n-type. Sonen ligger bare i halvlederen, som på n-siden av en p⁺n-overgang, og kapasitansen er $C_j = \\varepsilon A/W$."
  - id: schottky-diode
    section: Strømmen over barrieren
    onSheet: false
    tex: "\\begin{aligned} I &= I_0\\left(e^{qV/k_BT} - 1\\right) \\\\ I_0 &\\propto e^{-q\\Phi_B/k_BT} \\end{aligned}"
    label: "Strømmen gjennom en Schottky-kontakt, positiv fra metallet til halvlederen på n-type. Spenningen endrer barrieren fra halvledersiden, mens strømmen fra metallet over $\\Phi_B$ er den samme uansett spenning og setter $I_0$. Strømmen er majoritetsbærere, så det er ingen lagret ladning og ingen lagringstid."
  - id: schottky-termionisk
    section: Strømmen over barrieren
    onSheet: false
    tex: "I = ABT^2\\,e^{-q\\Phi_B/k_BT}\\,e^{qV/nk_BT}"
    label: "Strømmen i lederetningen regnet fullt ut, på samme måte som termionisk emisjon av elektroner fra en varm metalloverflate. $B$ er en effektiv Richardson-konstant for overgangen, og $n$ ligger mellom 1 og 2, fordi barrieren i en virkelig kontakt endrer seg litt med spenningen."
  - id: heteroovergang-sprang
    section: Heterooverganger
    onSheet: false
    tex: "\\begin{aligned} \\Delta E_g &= E_{g1} - E_{g2} \\\\ &= \\Delta E_c + \\Delta E_v \\\\ \\Delta E_c &= q(\\chi_2 - \\chi_1) \\end{aligned}"
    label: "Sprangene i båndkantene ved en heteroovergang, med 1 for materialet med størst båndgap. Den nederste linjen er Andersons affinitetsregel, som gjelder i det ideelle tilfellet; i praksis måles sprangene. For GaAs–AlGaAs er $\\Delta E_c$ omtrent to tredjedeler av $\\Delta E_g$."
  - id: hetero-spenningsdeling
    section: Heterooverganger
    onSheet: false
    tex: "\\dfrac{V_{01}}{V_{02}} = \\dfrac{\\varepsilon_2N_{d2}}{\\varepsilon_1N_{a1}}"
    label: "Hvordan kontaktpotensialet $V_0 = V_{01} + V_{02}$ deles i en heteroovergang med p-type på side 1 og n-type på side 2. Fra Poissons ligning med $\\varepsilon_1\\mathcal{E}_1 = \\varepsilon_2\\mathcal{E}_2$ ved grenseflaten. Den lettest dopede siden tar mest av spenningen."
  - id: lastlinje
    section: Transistoren i en krets
    onSheet: false
    tex: "V_{DD} = I_DR_L + V_D"
    label: "Lastlinjen: Kirchhoffs spenningslov for en transistor i serie med motstanden $R_L$ til kilden $V_{DD}$. I diagrammet for $I_D$ mot $V_D$ er den en rett linje fra $V_D = V_{DD}$ ved $I_D = 0$ til $I_D = V_{DD}/R_L$ ved $V_D = 0$, og arbeidspunktet er der den krysser kurven for gatespenningen."
  - id: forsterkning
    section: Transistoren i en krets
    onSheet: false
    tex: "\\begin{aligned} v_d &= -g_mR_Lv_g \\\\ g_m &= \\dfrac{\\partial I_D(\\text{sat.})}{\\partial V_G} \\end{aligned}"
    label: "Et lite signal $v_g$ på gaten gir signalet $v_d$ på drain når transistoren er i metning, der strømmen bare avhenger av gatespenningen. Mer strøm gir større fall over $R_L$ og mindre spenning over transistoren, derfor minustegnet. $g_m$ er transkonduktansen, i siemens."
  - id: svitsjetid
    section: Transistoren i en krets
    onSheet: false
    tex: "\\tau = \\dfrac{C_LV_{DD}}{I_D(\\text{sat.})}"
    label: "Tiden en transistor bruker på å lade eller tømme kapasitansen $C_L$ til neste trinn når den fører strømmen $I_D(\\text{sat.})$. Stor strøm i metning gir en rask bryter."
  - id: jfet-sonebredde
    section: JFET-en
    onSheet: false
    tex: "\\begin{aligned} W(x) &= \\left[\\dfrac{2\\varepsilon(V_0 + V_x - V_G)}{qN_d}\\right]^{1/2} \\\\ h(x) &= a - W(x) \\end{aligned}"
    label: "Romladningssonen fra gaten i punktet $x$ i en n-kanal-JFET med p⁺-gater. Spenningen i kanalen, $V_x$, går fra 0 ved source til $V_D$ ved drain, så sperrespenningen $V_x - V_G$ og sonen er størst ved drain. Bare halvhøyden $h$ av kanalen leder. Gjelder når kanalhøyden endrer seg langsomt langs kanalen."
  - id: kvasi-fermi-strom
    section: JFET-en
    onSheet: false
    tex: "J_n = \\mu_nn\\dfrac{dF_n}{dx}"
    label: "Elektronstrømmen, drift og diffusjon sammen, er satt av hellingen til kvasi-Fermi-nivået. Med $F_n = F_n(0) - qV_x$ blir strømtettheten fra drain mot source i kanalen $\\sigma\\,dV_x/dx$, der $V_x$ er spenningen et voltmeter måler."
  - id: avklemmingsspenning
    section: Avklemming og metning
    onSheet: false
    tex: "\\begin{aligned} V_p &= \\dfrac{qN_da^2}{2\\varepsilon} \\\\ V_D(\\text{sat.}) &= V_G + V_p - V_0 \\end{aligned}"
    label: "Avklemmingsspenningen i en n-kanal-JFET med halvhøyden $a$: barrieren $V_0 - V$ over gateovergangen som gjør sonen like bred som halve kanalen. Kontaktpotensialet står for $V_0$ av den, så kanalen klemmes av ved drain når $V_D - V_G = V_p - V_0$, og strømmen metter. $V_G = V_0 - V_p$ stenger kanalen i hele lengden."
  - id: jfet-gjennombrudd
    section: Gatestyring og gjennombrudd
    onSheet: false
    tex: "V_D = V_\\text{br} + V_G"
    label: "Drain-spenningen der gateovergangen i en n-kanal-JFET bryter gjennom. Sperrespenningen er størst ved drain, der den er $V_D - V_G$, så med negativ $V_G$ kommer skredet ved en lavere drain-spenning."
  - id: jfet-strom
    section: Strømmen før avklemming
    onSheet: false
    tex: "\\begin{aligned} I_D &= G_0V_p\\Big[\\dfrac{V_D}{V_p} \\\\ &\\quad - \\tfrac23\\Big(\\dfrac{V_0 + V_D - V_G}{V_p}\\Big)^{3/2} \\\\ &\\quad + \\tfrac23\\Big(\\dfrac{V_0 - V_G}{V_p}\\Big)^{3/2}\\Big] \\\\ G_0 &= \\dfrac{Z}{L}\\,2aq\\mu_nN_d \\end{aligned}"
    label: "Drain-strømmen i en n-kanal-JFET før avklemming, fra kanalen delt i skiver med hver sin halvhøyde og integrert fra source til drain med tilnærmingen med gradvis kanal. $G_0$ er konduktansen til kanalen uten romladningssoner, $Z$ er kanalbredden og $L$ kanallengden. Gjelder til $V_D(\\text{sat.}) = V_G + V_p - V_0$, der stigningen $\\partial I_D/\\partial V_D$ er null."
  - id: jfet-metning
    section: Strømmen i metning og transkonduktansen
    onSheet: false
    tex: "\\begin{aligned} &I_D(\\text{sat.}) = G_0V_p\\Big[\\tfrac13 - \\dfrac{V_0 - V_G}{V_p} \\\\ &\\qquad + \\tfrac23\\Big(\\dfrac{V_0 - V_G}{V_p}\\Big)^{3/2}\\Big] \\end{aligned}"
    label: "Strømmen i metning i en n-kanal-JFET: $I_D$ ved avklemming, $V_D = V_G + V_p - V_0$, regnet konstant for større $V_D$. Den avhenger bare av $V_G$ og er null ved $V_G = V_0 - V_p$, der kanalen er stengt i hele lengden. Gjelder for $V_0 - V_p \\le V_G \\le 0$."
  - id: jfet-transkonduktans
    section: Strømmen i metning og transkonduktansen
    onSheet: false
    tex: "\\begin{aligned} &g_m(\\text{sat.}) = \\dfrac{\\partial I_D(\\text{sat.})}{\\partial V_G} \\\\ &= G_0\\left[1 - \\left(\\dfrac{V_0 - V_G}{V_p}\\right)^{1/2}\\right] \\end{aligned}"
    label: "Transkonduktansen i metning i en n-kanal-JFET. Den er den samme konduktansen $G_0h(0)/a$, satt av halvhøyden ved source, som stigningen $\\partial I_D/\\partial V_D$ ved liten $V_D$. Den er størst ved $V_G = 0$ og aldri større enn $G_0$, og den er null der kanalen stenges."
  - id: jfet-kvadratlov
    section: Strømmen i metning og transkonduktansen
    onSheet: false
    tex: "I_D(\\text{sat.}) \\approx I_{DSS}\\Big(1 + \\tfrac{V_G}{V_p - V_0}\\Big)^2"
    label: "Parabelen som målt strøm i metning nesten følger. $I_{DSS}$ er strømmen i metning med $V_G = 0$, og parabelen er null der kanalen stenges, ved $V_G = V_0 - V_p$."

  # Resten av formelarket (Streetman kap. 6–8) står her før modulene er skrevet.
  # Bytt seksjonsnavnene til modulenes overskrifter når modulene kommer.
  - id: mos-kapasitans
    section: MOS-kondensatoren
    onSheet: true
    tex: "\\begin{aligned} C_i &= \\dfrac{\\varepsilon_i}{d}, \\qquad C_d = \\dfrac{\\varepsilon_s}{W} \\\\ C &= \\dfrac{C_iC_d}{C_i + C_d} \\end{aligned}"
    label: "Kapasitansene per areal i en MOS-kondensator: oksidet med tykkelse $d$ og permittivitet $\\varepsilon_i$, og romladningssonen med bredde $W$ i halvlederen med permittivitet $\\varepsilon_s$. De står i serie, så den minste dominerer. I akkumulasjon er kapasitansen lik oksidets, og i utarming synker den når $W$ vokser."
  - id: inversjon
    section: MOS-kondensatoren
    onSheet: true
    tex: "\\phi_s(\\text{inv.}) = 2\\phi_F = 2\\dfrac{k_BT}{q}\\ln\\dfrac{N_a}{n_i}"
    label: "Sterk inversjon: overflaten er like sterkt n-type som substratet er p-type når båndene er bøyd ned $2\\phi_F$, der $q\\phi_F = E_i - E_F$ i substratet. Overflatepotensialet $\\phi_s$ er båndbøyningen fra substratet til overflaten."
  - id: mos-sonebredde
    section: MOS-kondensatoren
    onSheet: true
    tex: "W = \\left[\\dfrac{2\\varepsilon_s\\phi_s}{qN_a}\\right]^{1/2}"
    label: "Bredden av romladningssonen under gaten ved overflatepotensialet $\\phi_s$, som i en ensidig overgang. Ved inversjon slutter den å vokse, fordi mer gateladning går til elektronene i kanalen; den største bredden $W_m$ er verdien ved $\\phi_s = 2\\phi_F$."
  - id: mos-sonelading
    section: MOS-kondensatoren
    onSheet: true
    tex: "Q_d = -qN_aW_m = -2(\\varepsilon_s qN_a\\phi_F)^{1/2}"
    label: "Ladningen per areal i romladningssonen ved inversjon: de ioniserte akseptorene i den største sonebredden $W_m$. Negativ i et p-type substrat."
  - id: terskelspenning
    section: MOS-kondensatoren
    onSheet: true
    tex: "V_T = \\underbrace{\\Phi_{ms} - \\dfrac{Q_i}{C_i}}_{\\text{flatbånd}} - \\dfrac{Q_d}{C_i} + 2\\phi_F"
    label: "Terskelspenningen for en n-kanal-MOSFET på p-type substrat, gatespenningen som gir sterk inversjon. De to første leddene er flatbåndspenningen $V_{FB}$: $\\Phi_{ms}$ er forskjellen i arbeidsfunksjon mellom metallet og halvlederen, og $Q_i$ er ladningen per areal i oksidet og ved grenseflaten. Deretter må gaten bære ladningen $Q_d$ i romladningssonen og bøye båndene $2\\phi_F$."
  - id: debye-lengde
    section: MOS-kondensatoren
    onSheet: true
    tex: "L_D = \\sqrt{\\dfrac{\\varepsilon_s k_BT}{q^2p_0}}, \\qquad C_\\text{debye} = \\dfrac{\\varepsilon_s}{L_D}"
    label: "Debye-lengden er avstanden der en ladning i halvlederen skjermes av majoritetsbærerne, her hull i p-type. Den blir kortere med mer doping. Ved flatbånd er det denne lengden, ikke en romladningssone, som gir halvlederens kapasitans."
  - id: flatbaandskapasitans
    section: MOS-kondensatoren
    onSheet: true
    tex: "C_{FB} = \\dfrac{C_i\\,C_\\text{debye}}{C_i + C_\\text{debye}}"
    label: "MOS-kapasitansen ved flatbåndspenningen $V_{FB}$: oksidet i serie med Debye-kapasitansen. Spenningen der en målt C–V-kurve har verdien $C_{FB}$, er $V_{FB}$."
  - id: substratspenning
    section: MOS-kondensatoren
    onSheet: true
    tex: "\\Delta V_T \\simeq \\dfrac{\\sqrt{2\\varepsilon_s qN_a}}{C_i}\\,(-V_B)^{1/2} \\quad (\\text{n-kanal})"
    label: "Substrateffekten: en negativ spenning $V_B$ på p-substratet gjør romladningssonen under kanalen bredere, og terskelspenningen øker. Uttrykket gjelder når $|V_B|$ er stor mot $2\\phi_F$. Effekten er sterkere jo høyere substratet er dopet."
  - id: mosfet-strom-full
    section: MOSFET-en
    onSheet: true
    tex: "\\begin{aligned} &I_D = \\dfrac{\\bar{\\mu}_nZC_i}{L}\\Big\\{\\big(V_G - V_{FB} - 2\\phi_F - \\tfrac{1}{2}V_D\\big)V_D \\\\ &\\quad - \\tfrac{2}{3}\\dfrac{\\sqrt{2\\varepsilon_s qN_a}}{C_i}\\big[(V_D + 2\\phi_F)^{3/2} - (2\\phi_F)^{3/2}\\big]\\Big\\} \\end{aligned}"
    label: "Drain-strømmen i en n-kanal-MOSFET før metning, med ladningen i romladningssonen regnet med langs kanalen. $Z$ er kanalbredden, $L$ kanallengden, $C_i$ oksidkapasitansen per areal og $\\bar{\\mu}_n$ den midlere mobiliteten til elektronene i kanalen."
  - id: mosfet-strom
    section: MOSFET-en
    onSheet: true
    tex: "I_D \\simeq \\dfrac{\\bar{\\mu}_nZC_i}{L}\\Big[(V_G - V_T)V_D - \\tfrac{1}{2}V_D^2\\Big]"
    label: "Den vanlige tilnærmingen før metning: ladningen i romladningssonen regnes som konstant langs kanalen og samles i $V_T$. For liten $V_D$ er strømmen lineær i $V_D$, og kanalen er en motstand styrt av $V_G$."
  - id: mosfet-metning
    section: MOSFET-en
    onSheet: true
    tex: "\\begin{aligned} I_D(\\text{sat.}) &\\simeq \\tfrac{1}{2}\\bar{\\mu}_nC_i\\dfrac{Z}{L}(V_G - V_T)^2 \\\\ &= \\dfrac{Z}{2L}\\bar{\\mu}_nC_iV_D^2(\\text{sat.}) \\end{aligned}"
    label: "Metning: ved $V_D(\\text{sat.}) = V_G - V_T$ klemmes kanalen av ved drain, og større $V_D$ øker ikke strømmen. Strømmen vokser med kvadratet av $V_G - V_T$."
  - id: transkonduktans
    section: MOSFET-en
    onSheet: true
    tex: "\\begin{aligned} g_m &= \\dfrac{\\partial I_D}{\\partial V_G} \\\\ g_m(\\text{sat.}) &= \\dfrac{\\partial I_D(\\text{sat.})}{\\partial V_G} \\simeq \\dfrac{Z}{L}\\bar{\\mu}_nC_i(V_G - V_T) \\end{aligned}"
    label: "Transkonduktansen: hvor mye drain-strømmen endrer seg per volt på gaten. I metning vokser den lineært med $V_G - V_T$."
  - id: kort-kanal
    section: MOSFET-en
    onSheet: true
    tex: "I_D \\simeq ZC_i(V_G - V_T)v_s"
    label: "Kort kanal: feltet langs kanalen er så sterkt at elektronene går med metningshastigheten $v_s$. Metningsstrømmen blir da lineær i $V_G - V_T$ i stedet for kvadratisk, og uavhengig av $L$."
  - id: subterskel
    section: MOSFET-en
    onSheet: true
    tex: "S = \\dfrac{dV_G}{d(\\log I_D)} = \\dfrac{k_BT}{q}\\ln 10\\left[1 + \\dfrac{C_d + C_{it}}{C_i}\\right]"
    label: "Subterskelstigningen: gatespenningen som trengs for å endre strømmen én dekade under terskelen. Den er minst $(k_BT/q)\\ln 10 = 60$ mV per dekade ved 300 K. $C_{it}$ er kapasitansen fra grenseflatetilstandene; liten $S$ gir en bedre bryter."
  - id: bjt-kantoverskudd
    section: Bipolartransistoren
    onSheet: true
    tex: "\\begin{aligned} \\Delta p_E &= p_n\\left(e^{qV_{EB}/k_BT} - 1\\right) \\\\ \\Delta p_C &= p_n\\left(e^{qV_{CB}/k_BT} - 1\\right) \\end{aligned}"
    label: "Overskuddet av hull i basen ved emitter- og kollektorkanten av en pnp-transistor, satt av spenningen over hver overgang som i en diode. I normal drift er $V_{EB} > 0$ og $V_{CB} < 0$, så $\\Delta p_C \\approx -p_n$."
  - id: bjt-strommer
    section: Bipolartransistoren
    onSheet: true
    tex: "\\begin{aligned} I_{Ep} &= qA\\dfrac{D_p}{L_p}\\left(\\Delta p_E\\operatorname{ctnh}\\dfrac{W_b}{L_p} - \\Delta p_C\\operatorname{csch}\\dfrac{W_b}{L_p}\\right) \\\\ I_C &= qA\\dfrac{D_p}{L_p}\\left(\\Delta p_E\\operatorname{csch}\\dfrac{W_b}{L_p} - \\Delta p_C\\operatorname{ctnh}\\dfrac{W_b}{L_p}\\right) \\end{aligned}"
    label: "Hullstrømmen inn fra emitteren og strømmen ut i kollektoren, fra diffusjonsligningen i en base med bredde $W_b$ og overskuddet satt ved begge kantene. $\\operatorname{ctnh}$ er $\\coth$, og $I_{Ep}$ er bare hulldelen av emitterstrømmen."
  - id: basestrom
    section: Bipolartransistoren
    onSheet: true
    tex: "I_B = qA\\dfrac{D_p}{L_p}\\left[(\\Delta p_E + \\Delta p_C)\\tanh\\dfrac{W_b}{2L_p}\\right]"
    label: "Basestrømmen $I_{Ep} - I_C$: elektronene som må tilføres for å erstatte dem som rekombinerer med hull i basen. Liten når $W_b \\ll L_p$."
  - id: basetransportfaktor
    section: Bipolartransistoren
    onSheet: true
    tex: "\\begin{aligned} B &= \\dfrac{I_C}{I_{Ep}} = \\dfrac{\\operatorname{csch} W_b/L_p}{\\operatorname{ctnh} W_b/L_p} \\\\ &= \\operatorname{sech}\\dfrac{W_b}{L_p} \\simeq 1 - \\left(\\dfrac{W_b^2}{2L_p^2}\\right) \\end{aligned}"
    label: "Basetransportfaktoren: andelen av hullene fra emitteren som når kollektoren, med kollektoren i sperreretning så $\\Delta p_C$ er liten mot $\\Delta p_E$. Nær 1 når basen er mye kortere enn diffusjonslengden."
  - id: injeksjonseffektivitet
    section: Bipolartransistoren
    onSheet: true
    tex: "\\begin{aligned} \\gamma &= \\dfrac{I_{Ep}}{I_{En} + I_{Ep}} \\\\ &= \\left[1 + \\dfrac{L_p^n n_n\\mu_n^p}{L_n^p p_p\\mu_p^n}\\tanh\\dfrac{W_b}{L_p^n}\\right]^{-1} \\\\ &\\simeq \\left[1 + \\dfrac{W_b n_n\\mu_n^p}{L_n^p p_p\\mu_p^n}\\right]^{-1} \\end{aligned}"
    label: "Emitterens injeksjonseffektivitet: andelen av emitterstrømmen som er hull injisert i basen. Hevet skrift viser området, $n$ for basen og $p$ for emitteren, så $L_p^n$ er diffusjonslengden til hull i basen og $\\mu_n^p$ mobiliteten til elektroner i emitteren. $\\gamma$ nær 1 krever $p_p \\gg n_n$, en emitter som er mye sterkere dopet enn basen. Tilnærmingen gjelder for $W_b \\ll L_p^n$."
  - id: stromforsterkning-alfa
    section: Bipolartransistoren
    onSheet: true
    tex: "\\dfrac{i_C}{i_E} = B\\gamma \\equiv \\alpha"
    label: "Strømforsterkningen i felles-base-kobling: andelen av emitterstrømmen som kommer fram til kollektoren. Litt mindre enn 1."
  - id: stromforsterkning-beta
    section: Bipolartransistoren
    onSheet: true
    tex: "\\dfrac{i_C}{i_B} = \\dfrac{B\\gamma}{1 - B\\gamma} = \\dfrac{\\alpha}{1 - \\alpha} \\equiv \\beta"
    label: "Strømforsterkningen i felles-emitter-kobling. Siden $\\alpha$ ligger nær 1, blir $\\beta$ stor: $\\alpha = 0{,}99$ gir $\\beta = 99$."
  - id: beta-transittid
    section: Bipolartransistoren
    onSheet: true
    tex: "\\dfrac{i_C}{i_B} = \\beta = \\dfrac{\\tau_p}{\\tau_t} \\quad (\\gamma = 1)"
    label: "Med perfekt injeksjon: et elektron fra basekontakten venter i gjennomsnitt $\\tau_p$ på å rekombinere, og i mellomtiden går mange hull gjennom basen, hvert på transittiden $\\tau_t$."
  - id: fotostrom
    section: Fotodioden
    onSheet: true
    tex: "I_\\text{op} = qAg_\\text{op}(L_p + L_n + W)"
    label: "Fotostrømmen i en belyst pn-overgang: bærerpar som genereres inne i sonen eller innenfor en diffusjonslengde fra den, samles opp av feltet. Den går fra n til p, så diodeligningen blir $I = I_0(e^{qV/k_BT} - 1) - I_\\text{op}$."

glossary:
  - term: Valensbånd
    section: Fra bindinger til bånd
    definition: "(<em>valence band</em>) Det øverste båndet som er fullt av elektroner ved 0 K. Toppen betegnes $E_v$. I Si rommer det $4N$ tilstander, akkurat nok til de $4N$ valenselektronene."
  - term: Ledningsbånd
    section: Fra bindinger til bånd
    definition: "(<em>conduction band</em>) Det nederste tomme båndet ved 0 K, med bunnen $E_c$. Elektroner som eksiteres hit har mange ledige tilstander rundt seg og kan derfor bidra til strøm."
  - term: Bloch-funksjon
    section: Fra bindinger til bånd
    definition: "Bølgefunksjonen til et elektron i et periodisk gitter: en planbølge multiplisert med en funksjon som har gitterets periodisitet. Den er grunnlaget for å beskrive elektronet ved én bølgevektor $k$."
  - term: Kronig-Penney-modellen
    section: Fra bindinger til bånd
    definition: "(<em>Kronig–Penney model</em>) Den enkleste modellen som gir bånd og gap: et 1D-gitter regnet som en uendelig, periodisk rekke rektangulære barrierer. Kontinuitet i $\\psi$ og $d\\psi/dx$ pluss Bloch-kravet gir én ligning $\\cos ka = f(E)$, og energier med $|f(E)| > 1$ har ingen $k$; de intervallene er båndgapene."
  - term: E-k-diagram
    section: Hvorfor et fullt bånd ikke leder
    definition: "Plott av elektronets totale energi mot bølgevektoren $k$, for én krystallretning. Stigningstallet gir hastigheten, krumningen gir effektiv masse, og om ekstremalpunktene ligger ved samme $k$, avgjør om halvlederen er direkte eller indirekte."
  - term: Gruppehastighet
    section: Hvorfor et fullt bånd ikke leder
    definition: "(<em>group velocity</em>) Farten til bølgepakken bæreren består av, $v = \\frac{1}{\\hbar}\\frac{dE}{dk}$, altså stigningstallet i $E(k)$. På bunnen av båndet er den null, uansett hvor stor $k$ er."
  - term: Direkte halvleder
    section: Lys eller varme
    definition: "(<em>direct semiconductor</em>) Ledningsbåndminimet og valensbåndmaksimet ligger ved samme $k$, som i GaAs ($E_g = 1{,}43$ eV). Et elektron kan falle rett ned og gi fra seg $E_g$ som et foton, og derfor brukes slike materialer i lysdioder og lasere."
  - term: Indirekte halvleder
    section: Lys eller varme
    definition: "(<em>indirect semiconductor</em>) Ledningsbåndminimet ligger ved en annen $k$ enn valensbåndmaksimet, som i Si. Overgangen krever en momentumendring i tillegg til energiendringen, og går gjerne via en defekttilstand med energien avgitt som varme."
  - term: Fonon
    section: Lys eller varme
    definition: "(<em>phonon</em>) Et kvantum av gittervibrasjon. Det bærer momentum på Brillouinsonens skala og svært lite energi, og er derfor partneren en indirekte halvleder må låne momentum av. Fotonet leverer energien, fononet momentumet."
  - term: Krystallmomentum
    section: Hvorfor et fullt bånd ikke leder
    definition: "(<em>crystal momentum</em>) Størrelsen $\\hbar k$. Den oppfører seg som bevegelsesmengde overfor <em>ytre</em> krefter, og er likevel ikke elektronets virkelige bevegelsesmengde, siden gitterkreftene er utelatt."
  - term: Effektiv masse
    section: Effektiv masse
    definition: "(<em>effective mass</em>) Tallet $m^*$ som må stå i Newtons lov for at den ytre kraften alene skal gi riktig akselerasjon: gitterkreftene ligger allerede i tallet. Den finnes fra krumningen til $E(k)$, og er derfor ulik i ulike materialer selv om elektronets <em>ekte</em> masse er den samme."
  - term: Hull
    section: Elektronene i en silisiumkrystall
    definition: "(<em>hole</em>) En tom tilstand i valensbåndet, regnet som én bærer med positiv ladning og positiv masse. Strømmen bæres av de gjenværende elektronene, og hullregnskapet gir den samme strømmen med ett ledd i stedet for $10^{23}$."
  - term: Elektron-hull-par
    section: Elektronene i en silisiumkrystall
    definition: "(<em>electron-hole pair</em>) Et ledningsbåndelektron og hullet det etterlot seg i valensbåndet, laget i samme eksitasjon (EHP). Termisk eller optisk energi $\\ge E_g$ kreves for å lage ett."
  - term: Intrinsisk halvleder
    section: Elektronene i en silisiumkrystall
    definition: "(<em>intrinsic semiconductor</em>) En perfekt krystall uten dopanter eller gitterfeil, der de eneste bærerne er termisk genererte par. Da er $n = p = n_i$."
  - term: Ekstrinsisk halvleder
    section: Doping
    definition: "(<em>extrinsic semiconductor</em>) En halvleder der dopanter gjør likevektskonsentrasjonene $n_0$ og $p_0$ forskjellige fra $n_i$. Nesten alle komponenter er bygd av ekstrinsisk materiale."
  - term: Donor
    section: Doping
    definition: "En urenhet fra gruppe V (P, As, Sb) i Si eller Ge, med ett valenselektron til overs. Den legger et fylt nivå $E_d$ like under $E_c$ og står igjen som et fast positivt ion når elektronet er avgitt. Ved romtemperatur er praktisk talt alle ionisert i Si, fordi $E_c - E_d$ bare er et par $k_BT$ og ledningsbåndet har langt flere tilstander enn det er donorer."
  - term: Akseptor
    section: Doping
    definition: "En urenhet fra gruppe III (B, Al, Ga, In) i Si eller Ge, med ett valenselektron for lite. Den legger et tomt nivå $E_a$ like over $E_v$, tar imot et valensbåndelektron og etterlater et hull."
  - term: n-type materiale
    section: Doping
    definition: "Halvleder dopet med donorer, der $n_0 \\gg (n_i, p_0)$. Elektroner er majoritetsbærere, hull er minoritetsbærere."
  - term: p-type materiale
    section: Doping
    definition: "Halvleder dopet med akseptorer, der $p_0 \\gg (n_i, n_0)$. Hull er majoritetsbærere, elektroner er minoritetsbærere."
  - term: Majoritetsbærere
    section: Doping
    definition: "(<em>majority carriers</em>) Bærertypen som dominerer etter doping, altså elektroner i n-type og hull i p-type. Dopingen kan endre antallet med mange tierpotenser."
  - term: Minoritetsbærere
    section: Doping
    definition: "(<em>minority carriers</em>) Den fåtallige bærertypen, altså hull i n-type og elektroner i p-type. De er få, og de styrer likevel oppførselen til pn-overganger og bipolare transistorer."
  - term: Fermi-Dirac-fordelingen
    section: Sannsynligheten for at en tilstand er fylt
    definition: "(<em>Fermi–Dirac distribution</em>) $f(E) = [1 + e^{(E - E_F)/k_BT}]^{-1}$, sannsynligheten for at en tilstand med energien $E$ er fylt ved termisk likevekt. Følger av Pauli-prinsippet og av at et hopp som øker energien med $\\Delta E$, er $e^{-\\Delta E/k_BT}$ ganger så sannsynlig som hoppet tilbake. Ved 0 K er den et trinn, med alt under $E_F$ fylt og alt over tomt."
  - term: Fermi-nivå
    section: Hvor Fermi-nivået står
    definition: "(<em>Fermi level</em>) Energien $E_F$ der en tilstand er fylt med sannsynligheten $\\tfrac{1}{2}$. Nivået står der antall elektroner krever: nær midten av gapet i intrinsisk materiale, nær $E_c$ i n-type og nær $E_v$ i p-type. Den samme $f$ gir både elektronene og hullene, så $E_F$ alene bestemmer $n_0$ og $p_0$."
  - term: Tilstandstetthet
    section: Tilstandene i et bånd
    definition: "(<em>density of states</em>) $N(E)$, antall tilstander per volum og energienhet. De tillatte $\\vec k$ ligger jevnt i $k$-rommet, og nær en båndkant vokser energien som $k^2$, så $N(E)$ vokser som $\\sqrt{E - E_c}$, fra null på selve kanten. Produktet $f(E)N(E)$ er det som telles når $n_0$ skal regnes ut."
  - term: Effektiv tilstandstetthet
    section: Konsentrasjonene
    definition: "(<em>effective density of states</em>) $N_c$ og $N_v$, antallet tilstander som, lagt på selve båndkanten, gir like mange bærere som hele båndet, slik at $n_0 = N_c f(E_c)$. Av størrelsesorden $10^{19}$ cm⁻³ for Si ved 300 K, og de vokser som $T^{3/2}$."
  - term: Boltzmann-tilnærmingen
    section: Konsentrasjonene
    definition: "(<em>Boltzmann approximation</em>) $f(E) \\approx e^{-(E - E_F)/k_BT}$ når $E - E_F$ er mer enn omtrent $3k_BT$; da er feilen under 5 %. Gjelder for vanlig doping, der $E_F$ holder seg unna båndkantene; svikter når dopingen presser $E_F$ helt inntil en kant."
  - term: Massevirkningsloven
    section: Massevirkningsloven
    definition: "(<em>mass action law</em>) $n_0 p_0 = n_i^2$ ved termisk likevekt, uansett doping. Dobler dopingen $n_0$, halveres $p_0$, fordi hvert hull da finner et elektron dobbelt så fort, mens nye par lages like ofte."
  - term: Intrinsisk nivå
    section: Fermi-nivået målt fra det intrinsiske nivået
    definition: "(<em>intrinsic level</em>) $E_i$, energien $E_F$ har i intrinsisk materiale. Nivået ligger nær midten av gapet, forskjøvet litt fordi $N_c \\neq N_v$; i Si omtrent 13 meV under midten ved romtemperatur."
  - term: Kompensasjon
    section: Donorer og akseptorer i samme materiale
    definition: "(<em>compensation</em>) Akseptorene i en krystall med både donorer og akseptorer tar elektronene fra like mange donorer, så ledningsbåndet sitter igjen med $n_0 \\approx N_d - N_a$ når $N_d - N_a \\gg n_i$. Med $N_a = N_d$ oppfører materialet seg som rent, selv om det er fullt av dopeatomer."
  - term: Ladningsnøytralitet
    section: Donorer og akseptorer i samme materiale
    definition: "(<em>space charge neutrality</em>) Kravet $p_0 + N_d^+ = n_0 + N_a^-$: krystallen er nøytral, så positiv og negativ ladning balanserer. $E_F$ stiller seg dit kravet og massevirkningsloven er oppfylt samtidig."
  - term: Drift
    section: Drift
    definition: "(<em>drift</em>) Den jevne bevegelsen et elektrisk felt gir bærerne. Feltet gir dem fart mellom kollisjonene, og hver kollisjon gir dem en ny, tilfeldig fart, så de driver med en fast fart $\\mu\\mathcal{E}$, elektronene mot feltet og hullene med det."
  - term: Termisk fart
    section: Drift
    definition: "(<em>thermal velocity</em>) Farten bærerne har fra varmen alene, fra $\\tfrac12 m^*v_\\text{th}^2 = \\tfrac32 k_BT$. For elektroner i Si ved romtemperatur er den omtrent $2 \\times 10^7$ cm/s, langt større enn drifthastigheten i et vanlig felt."
  - term: Mobilitet
    section: Drift
    definition: "(<em>mobility</em>) Drifthastigheten en bærer får per felt, $\\mu = q\\bar{t}/m^*$, i cm²/V·s. Lett effektiv masse og lang tid mellom kollisjonene gir høy mobilitet; i rent Si ved 300 K er $\\mu_n = 1350$ og $\\mu_p = 480$ cm²/V·s."
  - term: Midlere kollisjonstid
    section: Drift
    definition: "(<em>mean free time</em>) $\\bar{t}$, tiden mellom to kollisjoner for en bærer i snitt. Sannsynligheten for en kollisjon i løpet av $dt$ er $dt/\\bar{t}$, så antallet bærere som ennå ikke har kollidert, faller som $e^{-t/\\bar{t}}$. For elektroner i Si ved romtemperatur er den rundt $0{,}2$ ps."
  - term: Midlere fri veilengde
    section: Drift
    definition: "(<em>mean free path</em>) $l = v_\\text{th}\\bar{t}$, strekningen en bærer går mellom to kollisjoner i snitt. For elektroner i Si ved romtemperatur er den omtrent 45 nm, over 80 gitterkonstanter."
  - term: Gitterspredning
    section: Det som sprer bærerne
    definition: "(<em>lattice scattering</em>) Spredning mot gittersvingningene, som også kalles fononer. Svingningene vokser med temperaturen, og mobiliteten fra denne spredningen faller omtrent som $T^{-3/2}$; i rent Si er det den som begrenser mobiliteten ved romtemperatur."
  - term: Urenhetsspredning
    section: Det som sprer bærerne
    definition: "(<em>impurity scattering</em>) Avbøyning i Coulomb-feltet fra ioniserte dopeatomer, både donorer og akseptorer. Langsomme bærere bøyes mest, så mekanismen dominerer ved lav temperatur og høy doping, med en mobilitet som vokser omtrent som $T^{3/2}$."
  - term: Metningshastighet
    section: Sterke felt
    definition: "(<em>saturation velocity</em>) Den øvre grensen for drifthastigheten i sterke felt, i Si omtrent $10^7$ cm/s, av samme størrelsesorden som den termiske farten. Over rundt $10^3$ V/cm vokser drifthastigheten saktere enn $\\mu\\mathcal{E}$: raske elektroner spres oftere mot gittersvingningene, så $\\bar{t}$ blir kortere, og energien feltet tilfører, går til gitteret i stedet for til raskere drift."
  - term: Hall-effekten
    section: Hall-effekten
    definition: "(<em>Hall effect</em>) Et magnetfelt på tvers av strømmen presser bærerne mot den ene kanten, til feltet på tvers, $\\mathcal{E}_y = v_x\\mathcal{B}_z$, holder igjen. Hull og elektroner havner på den samme kanten, så fortegnet på spenningen på tvers, Hall-spenningen, gir bærertypen. Størrelsen gir konsentrasjonen, og sammen med resistiviteten mobiliteten."
  - term: Overskuddsbærere
    section: Lys lager elektron-hull-par
    definition: "(<em>excess carriers</em>) Bærere ut over likevektskonsentrasjonene, $\\delta n = n - n_0$ og $\\delta p = p - p_0$, laget av lys med $h\\nu \\ge E_g$ eller sprøytet inn over en kontakt. De lages og forsvinner parvis, så $\\delta n = \\delta p$ når ingen bærere er fanget i en felle."
  - term: Lav injeksjon
    section: Lys lager elektron-hull-par
    definition: "(<em>low-level injection</em>) Overskuddet er lite mot majoritetskonsentrasjonen, $\\delta p \\ll n_0$ i n-type. Da endrer lyset nesten bare minoritetsbærerne, $\\delta p^2$-leddet i rekombinasjonen kan strykes, og overskuddet dør ut eksponentielt med én levetid. Ved sonekantene i en pn-overgang: $\\Delta p_n \\ll N_d$ og $\\Delta n_p \\ll N_a$; grensen nås først på den lett dopede siden."
  - term: Levetid
    section: Rekombinasjon og levetid
    definition: "(<em>minority carrier lifetime</em>) Tiden et overskudd av minoritetsbærere bruker på å falle med en faktor $e$ ved lav injeksjon, $\\tau_p$ for hull i n-type og $\\tau_n$ for elektroner i p-type. Ved direkte rekombinasjon er $\\tau_p = 1/a_rn_0$, fordi hvert hull har $n_0$ elektroner som kan falle ned i det. Majoriteten i overskuddet forsvinner like fort, parvis med minoriteten."
  - term: Rekombinasjonssenter
    section: Rekombinasjon og levetid
    definition: "(<em>recombination center</em>) En urenhet eller defekt med et nivå $E_r$ dypt i gapet. Et elektron i senteret faller ned i et hull i valensbåndet, og så faller et elektron fra ledningsbåndet ned i det tomme senteret, så et par forsvinner og energien går til gitteret som varme. Dominerer rekombinasjonen i indirekte halvledere som Si og Ge; gull i Si gir slike nivåer."
  - term: Felle
    section: Rekombinasjon og levetid
    definition: "(<em>trap</em>) Et nivå i gapet som slipper den fangede bæreren tilbake til båndet før den andre bærertypen kommer, så den holder på bæreren en stund uten at noe par forsvinner. Nivåer nær et av båndene virker oftest som feller, nivåer dypt i gapet som rekombinasjonssentre."
  - term: Kvasi-Fermi-nivå
    section: Jevnt lys og kvasi-Fermi-nivåer
    definition: "(<em>quasi-Fermi level</em>, IMREF) Nivået $F_n$ for elektronene i ledningsbåndet og $F_p$ for hullene i valensbåndet utenfor likevekt, definert ved $n = n_i e^{(F_n - E_i)/k_BT}$ og $p = n_i e^{(E_i - F_p)/k_BT}$. Inne i et bånd fordeler bærerne seg på pikosekunder, mellom båndene tar det mikrosekunder, så under lys har hvert bånd sitt eget nivå. I likevekt er $F_n = F_p = E_F$, og minoritetsnivået flytter seg mest."
  - term: Diffusjon
    section: Diffusjon
    definition: "(<em>diffusion</em>) Netto bevegelse fra høy til lav konsentrasjon som følger av tilfeldig termisk bevegelse alene. Partikkelfluksen er $\\phi_n = -D_n\\,dn/dx$, og diffusjonsstrømmen er fluksen ganger ladningen, så elektron- og hullstrømmene går hver sin vei i samme gradient."
  - term: Diffusjonskoeffisient
    section: Diffusjon
    definition: "(<em>diffusion coefficient</em>) $D = l^2/2\\bar{t}$ i den enkle modellen, i cm²/s. Knyttet til mobiliteten ved Einstein-relasjonen $D/\\mu = k_BT/q$; for Si er $D_n = 35$ og $D_p = 12{,}5$ cm²/s."
  - term: Innebygd felt
    section: Innebygd felt og Einstein-relasjonen
    definition: "(<em>built-in field</em>) Feltet som finnes i likevekt der dopingen varierer. Bærerne som har diffundert mot den lett dopede siden, etterlater ioner med ladning, og ladningen gir et felt som driver bærerne tilbake akkurat like fort som de diffunderer, så det går ingen strøm og $E_F$ er flatt."
  - term: Einstein-relasjonen
    section: Innebygd felt og Einstein-relasjonen
    definition: "(<em>Einstein relation</em>) $D/\\mu = k_BT/q$, som følger av at driften i det innebygde feltet opphever diffusjonen i likevekt. Forholdet er $0{,}0259$ V ved romtemperatur for begge bærertypene. Både $D$ og $\\mu$ er satt av kollisjonene, så en bærer som kolliderer ofte, diffunderer sakte og driver sakte."
  - term: Kontinuitetsligningen
    section: Kontinuitetsligningen
    definition: "(<em>continuity equation</em>) $\\partial\\,\\delta p/\\partial t = -(1/q)\\,\\partial J_p/\\partial x - \\delta p/\\tau_p$: overskuddet i en skive endrer seg med det som strømmer inn, minus det som strømmer ut, minus det som rekombinerer. Med ren diffusjonsstrøm blir den diffusjonsligningen."

  - term: Diffusjonslengde
    section: Stasjonær injeksjon og diffusjonslengden
    definition: "(<em>diffusion length</em>) $L_p = \\sqrt{D_p\\tau_p}$, hvor langt et hull diffunderer på én levetid. Et stasjonært overskudd i enden av en lang stav har falt til $1/e$ der, og et hull kommer i gjennomsnitt $L_p$ inn før det rekombinerer. For hull i Si med $\\tau_p = 1$ µs er $L_p = 35$ µm."
  - term: Haynes–Shockley-eksperimentet
    section: Haynes–Shockley-eksperimentet
    definition: "(<em>Haynes–Shockley experiment</em>) Et lysglimt lager et overskudd av bærere i en stav med felt langs, og en detektor lenger ned måler pulsen av minoritetsbærere. Tiden pulsen bruker, gir minoritetsmobiliteten, og bredden gir diffusjonskoeffisienten. Hall-effekten måler majoritetsbærerne."
  - term: pn-overgang
    section: Når p møter n
    definition: "(<em>p-n junction</em>) Skillet mellom et p-dopet og et n-dopet område i samme krystall, lagd ved implantasjon eller diffusjon gjennom et vindu i oksidet. Grunnenheten i dioder, transistorer, solceller og lysdioder."
  - term: Abrupt overgang
    section: Når p møter n
    definition: "(<em>step junction</em>) Modellen med jevn $N_a$ på den ene siden, jevn $N_d$ på den andre og et skarpt skille ved $x = 0$. I en implantert eller diffundert overgang endrer dopingen seg gradvis over skillet, og der er modellen en tilnærming."
  - term: Romladningssone
    section: Når p møter n
    definition: "(<em>space charge region</em>, <em>transition region</em>, <em>depletion region</em>) Sonen $W = x_{p0} + x_{n0}$ rundt skillet der bærerne er borte og de faste ionene står igjen som romladning. Feltet og hele potensialforskjellen ligger her; utenfor er materialet nøytralt."
  - term: Kontaktpotensial
    section: Båndskjemaet og kontaktpotensialet
    definition: "(<em>contact potential</em>, <em>built-in potential</em>) $V_0 = (k_BT/q)\\ln(N_aN_d/n_i^2)$, potensialforskjellen over romladningssonen i likevekt, med n-siden høyest. Barrieren de diffunderende bærerne må over. Kontaktpotensialet er en likevektsstørrelse: det driver ingen strøm, og et voltmeter over dioden viser null."
  - term: Utarmingstilnærmingen
    section: En sone uten bærere
    definition: "(<em>depletion approximation</em>) Sonen regnes som helt tømt for bærere, så ladningen der er bare ionene, $+qN_d$ og $-qN_a$, og materialet utenfor regnes som nøytralt. Gjør Poissons ligning til to konstanter og feltet til en trekant. Den holder når spenningen over sonen er mange $k_BT/q$: bærerkonsentrasjonen faller med en faktor $e$ for hver $k_BT/q$ potensialet endrer seg, så bærerne finnes bare nær kantene."
  - term: Forspenning
    section: Spenning over overgangen
    definition: "(<em>bias</em>) En spenning $V$ over dioden, regnet positiv med p-siden positiv. Den faller over romladningssonen og gjør barrieren $V_0 - V$. Lederetning (<em>forward bias</em>): $V > 0$, lavere barriere, smalere sone, stor strøm. Sperreretning (<em>reverse bias</em>): $V < 0$, høyere barriere, bredere sone, bare metningsstrømmen."
  - term: Generasjonsstrøm
    section: Fire strømmer med spenning
    definition: "(<em>generation current</em>) Driftstrømmen av minoritetsbærere som feies ned barrieren. Den går fra n til p, motsatt av diffusjonsstrømmen. Den er satt av hvor mange som når sonen per sekund, altså av den termiske generasjonen innenfor en diffusjonslengde, og er derfor uavhengig av spenningen. Lys nær sonen øker den."
  - term: Metningsstrøm
    section: Fire strømmer med spenning
    definition: "(<em>reverse saturation current</em>) $I_0$, strømmen i sperreretningen: generasjonsstrømmen alene, siden barrieren har stoppet diffusjonen. Den er liten og nesten uavhengig av sperrespenningen, og er samme $I_0$ som står foran $e^{qV/k_BT}$ i lederetningen."
  - term: Injeksjon
    section: Minoritetsbærerne ved kantene
    definition: "(<em>minority carrier injection</em>) Spenningen i lederetningen holder et overskudd av minoritetsbærere ved hver sonekant, $\\Delta p_n = p_n(e^{qV/k_BT} - 1)$ på n-siden og tilsvarende for elektroner på p-siden. Overskuddet diffunderer innover og rekombinerer, og diffusjonsstrømmen fra profilen er diodestrømmen."
  - term: Diodeligningen
    section: Diodeligningen
    definition: "(<em>diode equation</em>) $I = I_0(e^{qV/k_BT} - 1)$ med $I_0 = qA(D_pp_n/L_p + D_nn_p/L_n)$: summen av diffusjonsstrømmene ved de to sonekantene, uten rekombinasjon i sonen. Gjelder for begge fortegn av $V$; i sperreretningen er $I = -I_0$."
  - term: Ensidig overgang
    section: Diodeligningen
    definition: "(<em>p⁺n junction</em>, <em>one-sided junction</em>) En overgang der den ene siden er mye sterkere dopet enn den andre, skrevet p⁺n eller pn⁺. Den lett dopede siden tar nesten hele injeksjonen, holder nesten hele den lagrede ladningen og nesten hele romladningssonen, og setter gjennombruddsspenningen."
  - term: Ladningskontroll
    section: Ladningskontroll
    definition: "(<em>charge control approximation</em>) Strømmen inn i et område er ladningen som er lagret i minoritetsprofilen der, delt på levetiden: $I_p(0) = Q_p/\\tau_p$ med $Q_p = qAL_p\\Delta p_n$. Gir det samme som gradienten ved kanten, ofte raskere."
  - term: Ekstraksjon
    section: Minoritetsbærerne ved kantene
    definition: "(<em>minority carrier extraction</em>) Motstykket til injeksjon: i sperreretningen feies minoritetsbærerne som når sonekanten, over, og ingen kommer tilbake, så konsentrasjonen ved kantene går mot null og profilen er tømt en diffusjonslengde ut. Metningsstrømmen mates av termisk generasjon i det volumet."
  - term: Gjennombrudd
    section: Gjennombrudd
    definition: "(<em>reverse breakdown</em>) Ved sperrespenningen $V_\\text{br}$ vokser strømmen i sperreretningen bratt, og strømmen kan bli stor med nesten ingen økning i spenningen. Ikke ødeleggende i seg selv når kretsen begrenser strømmen; det er varmen som ødelegger. To mekanismer: Zener-effekten og skred."
  - term: Zener-gjennombrudd
    section: Zener-effekten
    definition: "(<em>Zener effect</em>) Gjennombrudd ved tunnelering i en tynn, sterkt dopet sone: sperrespenningen legger ledningsbåndet på n-siden overfor valensbåndet på p-siden, og elektroner tunnelerer gjennom barrieren med bredde $d$. Krever felt på omtrent $10^6$ V/cm og skjer under noen få volt."
  - term: Skredgjennombrudd
    section: Skredgjennombrudd
    definition: "(<em>avalanche breakdown</em>) Gjennombrudd i en bred, lett dopet sone: bærere som får nok energi i feltet, slår løs nye par ved støtionisasjon, og de nye kan slå løs flere. Multiplikasjonen er $M = 1/(1 - P)$. Fra noen volt til tusener; $V_\\text{br}$ vokser med båndgapet og faller med dopingen."
  - term: Støtionisasjon
    section: Skredgjennombrudd
    definition: "(<em>impact ionization</em>) En bærer med nok kinetisk energi slår løs et elektron-hull-par i en kollisjon med gitteret. Mekanismen bak skredgjennombrudd."
  - term: Likeretter
    section: Skredgjennombrudd
    definition: "(<em>rectifier</em>) En diode brukt til å slippe strøm bare én vei, så bare de positive halvperiodene av en vekselspenning kommer gjennom. Regnes som kortslutning i lederetningen og brudd i sperreretningen, eventuelt med et spenningsfall på omtrent $V_0$ og en seriemotstand i tillegg. God likeretter: liten $I_0$, stor $V_\\text{br}$, liten seriemotstand."
  - term: Gjennombruddsdiode
    section: Skredgjennombrudd
    definition: "(<em>breakdown diode</em>, <em>Zener diode</em>) En diode dopet for en bestemt $V_\\text{br}$, fra under én volt til flere hundre, brukt i gjennombrudd som spenningsregulator eller referanse. Kalles Zener-diode selv om mekanismen som regel er skred."

  - term: Kvasistasjonær tilnærming
    section: Når strømmen brytes
    definition: "(<em>quasi-steady state approximation</em>) Antagelsen at profilen av lagrede minoritetsbærere beholder formen $e^{-x_n/L_p}$ mens strømmen endrer seg, så $Q_p = qAL_p\\Delta p_n$ hele tiden. Gir spenningen fra ladningen, men grovt, fordi profilen endrer form nær kanten av sonen. Lagringstiden blir for lang."
  - term: Lagringstid
    section: Lagringstiden
    definition: "(<em>storage delay time</em>) $t_{sd}$, tiden etter omslag fra lederetning til sperreretning der kanten av sonen fortsatt har et overskudd av minoritetsbærere. Så lenge er spenningen over overgangen liten og positiv, og sperrestrømmen settes av kretsen. Proporsjonal med levetiden, og en vanlig måte å måle den på."
  - term: Svitsjediode
    section: Lagringstiden
    definition: "(<em>switching diode</em>) En diode laget for å slå raskt mellom lederetning og sperreretning. Kort levetid, for eksempel med gull i Si, eller lite lagret ladning i en kort diode gir kort lagringstid."
  - term: Kort diode
    section: Lagringstiden
    definition: "(<em>short diode</em>, <em>narrow base diode</em>) En diode der den lett dopede siden er kortere enn diffusjonslengden, så de fleste injiserte bærerne når kontakten før de rekombinerer. Profilen er nesten en rett linje, og lite ladning lagres. I en lang diode er siden mange diffusjonslengder."
  - term: Overgangskapasitans
    section: Overgangskapasitansen
    definition: "(<em>junction capacitance</em>, <em>depletion capacitance</em>) $C_j = \\varepsilon A/W$, kapasitansen fra ionene i romladningssonen. Avtar med sperrespenningen fordi sonen blir bredere, og dominerer i sperreretningen."
  - term: Varaktor
    section: Gradvise overganger
    definition: "(<em>varactor</em>) En diode som brukes i sperreretning som en kondensator styrt av spenningen, for eksempel til å stille inn frekvensen i en radiomottaker. $C_j \\propto V_r^{-1/2}$ i en abrupt overgang og $V_r^{-1/3}$ i en lineært gradvis. Dopingprofilen setter eksponenten."
  - term: Gradvis overgang
    section: Gradvise overganger
    definition: "(<em>graded junction</em>) En overgang der dopingen går gradvis fra p til n, som etter diffusjon eller implantasjon. Med lineær nettodoping $N_d - N_a = kx$ gjennom sonen blir feltet en parabel, $W \\propto (V_0 - V)^{1/3}$ og $C_j \\propto V_r^{-1/3}$."
  - term: Diffusjonskapasitans
    section: Diffusjonskapasitansen
    definition: "(<em>charge storage capacitance</em>, <em>diffusion capacitance</em>) $C_s$, kapasitansen fra den lagrede ladningen av minoritetsbærere. Bare den delen av ladningen som kommer tilbake ut over kanten av sonen når spenningen synker, teller. I en kort diode er det to tredjedeler, $C_s = \\tfrac{2}{3}\\,dQ_p/dV$. Vokser med strømmen og dominerer ved store strømmer i lederetningen."
  - term: Høy injeksjon
    section: Høy injeksjon og motstand
    definition: "(<em>high-level injection</em>) Overskuddet av bærere er like stort som eller større enn majoritetskonsentrasjonen. Da må spenningen løfte både minoritets- og majoritetsbærerne ved kanten, og strømmen vokser bare som $e^{qV/2k_BT}$."
  - term: Idealitetsfaktor
    section: Rekombinasjon og generasjon i sonen
    definition: "(<em>ideality factor</em>) $n$ i $I = I_0'(e^{qV/nk_BT} - 1)$. $n = 1$ når strømmen er diffusjon fra de nøytrale områdene, $n \\approx 2$ når den er rekombinasjon i sonen eller høy injeksjon. I en Schottky-kontakt ligger $n$ også mellom 1 og 2, fordi barrieren i en virkelig kontakt endrer seg litt med spenningen."

  - term: Arbeidsfunksjon
    section: Arbeidsfunksjon og elektronaffinitet
    definition: "(<em>work function</em>) $q\\Phi$, energien som skal til for å flytte et elektron fra Fermi-nivået og ut i vakuum like utenfor overflaten. Omtrent 4,3 eV for Al og 4,8 eV for Au. For en halvleder avhenger den av dopingen, $q\\Phi_s = q\\chi + (E_c - E_F)$."
  - term: Elektronaffinitet
    section: Arbeidsfunksjon og elektronaffinitet
    definition: "(<em>electron affinity</em>) $q\\chi$, avstanden fra ledningsbåndkanten opp til vakuumnivået. Fast for materialet og uavhengig av dopingen; 4,05 eV for Si."
  - term: Vakuumnivå
    section: Arbeidsfunksjon og elektronaffinitet
    definition: "(<em>vacuum level</em>) $E_\\text{vac}$, energien til et elektron i ro like utenfor materialet. Det lokale vakuumnivået ligger $q\\chi$ over ledningsbåndkanten og bøyer seg med den, så det endrer seg med $qV_0$ over en overgang. Det globale vakuumnivået langt unna er konstant."
  - term: Schottky-kontakt
    section: Schottky-kontakten
    definition: "(<em>Schottky barrier</em>, <em>Schottky diode</em>) En likerettende metall–halvleder-overgang, der halvlederen tømmes for majoritetsbærere nær grenseflaten: $\\Phi_m > \\Phi_s$ på n-type og $\\Phi_m < \\Phi_s$ på p-type. Strømmen er majoritetsbærere, så det lagres ingen minoritetsladning, og dioden slår raskt om."
  - term: Barrierehøyde
    section: Schottky-kontakten
    definition: "(<em>barrier height</em>) $\\Phi_B$, barrieren elektronene i metallet må over for å komme inn i halvlederen, $\\Phi_m - \\chi$ i en ideell kontakt på n-type. I en ideell kontakt endres den ikke av spenningen, og den setter metningsstrømmen, $I_0 \\propto e^{-q\\Phi_B/k_BT}$. I praksis måles den."
  - term: Ohmsk kontakt
    section: Ohmske kontakter
    definition: "(<em>ohmic contact</em>) En kontakt med lineær strøm–spenning-karakteristikk i begge retninger og liten motstand. Ideelt når majoritetsbærerne samles ved grenseflaten, $\\Phi_m < \\Phi_s$ på n-type. I praksis lages den med et sterkt dopet lag under metallet, så sonen blir tynn nok til at bærerne tunnelerer gjennom."
  - term: Grenseflatetilstander
    section: Virkelige Schottky-barrierer
    definition: "(<em>interface states</em>) Nivåer i gapet ved grenseflaten mellom halvlederen og metallet, fra ufullstendige bindinger og mellomlaget. Er det mange nok, låser de Fermi-nivået på et fast sted, så barrieren nesten ikke avhenger av metallet; på n-type GaAs blir den omtrent 0,8 eV."
  - term: Heteroovergang
    section: Heterooverganger
    definition: "(<em>heterojunction</em>) En overgang mellom to halvledere med ulikt båndgap, for eksempel AlGaAs og GaAs. Har de samme gitterkonstant, kan grenseflaten bli nesten fri for defekter. Båndkantene gjør sprangene $\\Delta E_c$ og $\\Delta E_v$ ved grenseflaten, så barrieren for elektroner og for hull blir forskjellig. En overgang i én halvleder er en homoovergang."
  - term: Andersons affinitetsregel
    section: Heterooverganger
    definition: "(<em>Anderson affinity rule</em>) $\\Delta E_c = q(\\chi_2 - \\chi_1)$: spranget i ledningsbåndet ved en heteroovergang er forskjellen i elektronaffinitet, og $\\Delta E_v = \\Delta E_g - \\Delta E_c$. Gjelder når vakuumnivået er kontinuerlig over grenseflaten; i praksis måles sprangene."
  - term: Todimensjonal elektrongass
    section: Elektroner i brønnen ved grenseflaten
    definition: "(<em>two-dimensional electron gas</em>) Elektroner fanget i en smal brønn i ledningsbåndet ved en heteroovergang, som ved N⁺-AlGaAs mot lett dopet GaAs. De beveger seg fritt bare langs grenseflaten. Donorene ligger i AlGaAs, så det er lite urenhetsspredning, og mobiliteten blir høy, særlig ved lave temperaturer."
  - term: Felteffekttransistor
    section: Transistoren i en krets
    definition: "(<em>field-effect transistor</em>, FET) En transistor der spenningen på gaten styrer strømmen mellom source og drain ved å endre hvor mye av kanalen som leder. Strømmen føres av majoritetsbærerne i kanalen, og gaten trekker nesten ingen strøm."
  - term: Lastlinje
    section: Transistoren i en krets
    definition: "(<em>load line</em>) Linjen $V_{DD} = I_DR_L + V_D$ for en transistor i serie med motstanden $R_L$ til kilden $V_{DD}$, tegnet i diagrammet for $I_D$ mot $V_D$. Arbeidspunktet er der den krysser kurven for gatespenningen."
  - term: Transkonduktans
    section: Transistoren i en krets
    definition: "(<em>transconductance</em>) $g_m = \\partial I_D/\\partial V_G$, hvor mye drain-strømmen endrer seg per volt på gaten, i siemens (A/V). I metning er $g_m = \\partial I_D(\\text{sat.})/\\partial V_G$, og med lastmotstanden $R_L$ blir signalet på drain $-g_mR_L$ ganger signalet på gaten."
  - term: JFET
    section: JFET-en
    definition: "(<em>junction field-effect transistor</em>) En felteffekttransistor der gaten er en pn-overgang i sperreretning mot kanalen. I en n-kanal-JFET ligger kanalen mellom to p⁺-gater, og romladningssonene fra gatene bestemmer hvor høy den ledende delen er. Gaten skal ha $V_G \\le 0$ og drain $V_D > 0$, målt fra source."
  - term: Avklemming
    section: Avklemming og metning
    definition: "(<em>pinch-off</em>) Romladningssonene fra de to gatene møtes og stenger kanalen. I en JFET skjer det først ved drain, når $V_D - V_G = V_p - V_0$. Strømmen metter da på $I_D(\\text{sat.})$, fordi spenningen ut over $V_D(\\text{sat.}) = V_G + V_p - V_0$ faller over den avklemte delen, der elektronene feies gjennom til drain."
  - term: Gradvis kanal
    section: Tilnærmingen med gradvis kanal
    definition: "(<em>gradual channel approximation</em>) Tilnærmingen at romladningssonen i hvert punkt langs kanalen er som i en plan overgang med spenningen i det punktet. Gjelder når kanalen er mye lengre enn den er høy, slik at leddet på tvers i Poissons ligning dominerer og halvhøyden endrer seg langsomt langs kanalen."

