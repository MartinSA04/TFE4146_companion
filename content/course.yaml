# Formelsamlingen. Merk: ingen formel er merket `memorize`. Hva som havner på
# det utdelte formelarket er ikke kjent før nær eksamen, og guiden skal ikke
# påstå noe om det. Sett `memorize: true` per formel når arket foreligger.
formulas:
  - id: bloch-funksjon
    section: E–k-diagrammet
    tex: "\\psi_k(x) = U(k_x, x)\\, e^{jk_x x}"
    label: "Bloch-funksjonen består av to faktorer. $e^{jk_x x}$ er en planbølge, og $U(k_x, x)$ er en funksjon som gjentar seg med gitterets periode, $U(k_x, x + a) = U(k_x, x)$. Elektronet i krystallen er ikke fritt, og beskrives likevel av én bølgevektor $k$."
  - id: gruppehastighet
    section: E–k-diagrammet
    tex: "v = \\dfrac{1}{\\hbar}\\dfrac{dE}{dk}"
    label: "Bærerens hastighet er gruppehastigheten til bølgepakken, altså <b>stigningstallet</b> i $E(k)$. På bunnen av båndet er $v = 0$ selv om $\\hbar k \\neq 0$."
  - id: krystallmomentum
    section: Effektiv masse
    tex: "F_\\text{ytre} = \\dfrac{d(\\hbar k)}{dt}"
    label: "Akselerasjonsteoremet. Bare den <em>ytre</em> kraften står på høyresiden, for gitterkreftene ligger allerede inne i formen på $E(k)$. Derfor er $\\hbar k$ <b>krystallmomentum</b> og ikke elektronets ekte bevegelsesmengde."
  - id: effektiv-masse
    section: Effektiv masse
    tex: "m^* = \\dfrac{\\hbar^2}{d^2E/dk^2}"
    label: "Effektiv masse fra <b>krumningen</b> til båndet. Med $m^*$ i Newtons lov holder $F = ma$ med bare den ytre kraften, siden gitterkreftene er pakket inn i tallet. Skarp krumning gir liten $m^*$, flatt bånd gir stor. Negativ krumning på valensbåndtoppen er grunnen til at vi regner med hull der."
  - id: parabolsk-band
    section: Effektiv masse
    tex: "E = E_c + \\dfrac{\\hbar^2 k^2}{2m^*}"
    label: "Parabolsk tilnærming nær et båndminimum. Så lenge båndet er parabolsk er $m^*$ <em>konstant</em>; høyere opp i båndet holder ikke tilnærmingen."
  - id: fullt-band-strom
    section: Elektroner og hull
    tex: "J = (-q)\\sum_{i=1}^{N} v_i = 0 \\quad\\Longrightarrow\\quad J = (-q)\\sum_{i=1}^{N} v_i - (-q)v_j = +q\\,v_j"
    label: "Et fullt bånd gir null strøm. Fjerner du elektron $j$, blir summen $+qv_j$, altså <em>nøyaktig</em> strømmen fra én positiv ladning med det manglende elektronets hastighet. Det er hullets opprinnelse."
  - id: generasjon-rekombinasjon
    section: Intrinsisk materiale
    tex: "r_i = a_r n_0 p_0 = g_i"
    label: "Likevekt er <em>dynamisk</em>: rekombinasjonsraten $r_i$ er proporsjonal med produktet $n_0p_0$, fordi et elektron og et hull må møtes, og den balanserer generasjonsraten $g_i$. Siden $g_i$ bare avhenger av temperaturen, er produktet låst: $n_0p_0 = n_i^2$."
  - id: hydrogenlik-donor
    section: Doping
    tex: "E_d = 13{,}6\\ \\text{eV}\\cdot\\dfrac{m_n^*/m_0}{\\varepsilon_r^2}, \\qquad a^* = a_0\\,\\dfrac{\\varepsilon_r}{m_n^*/m_0}"
    label: "Hydrogenatomets egne resultater med to bytter: lettere elektron ($m_n^*$) og skjermet Coulomb-kraft ($\\varepsilon_r$). Med $a_0 = 0{,}529$ Å gir det $25$ meV og $24$ Å for Si. Anslaget ligger konsekvent under det målte, fordi elektronet nær kjernen verken ser full $\\varepsilon_r$ eller én isotrop masse."
  - id: fermi-dirac
    section: Fermi–Dirac-fordelingen
    tex: "f(E) = \\dfrac{1}{1 + e^{(E - E_F)/k_BT}}"
    label: "Sannsynligheten for at en tillatt tilstand ved energi $E$ er okkupert ved termisk likevekt. $f(E_F) = \\tfrac{1}{2}$, og fordelingen er symmetrisk om nivået: $f(E_F + \\Delta E) = 1 - f(E_F - \\Delta E)$. Ved 300 K er $k_BT = 0{,}0259$ eV."
  - id: likevektskonsentrasjoner
    section: Fra fordeling til konsentrasjon
    tex: "n_0 = N_c\\, e^{-(E_c - E_F)/k_BT}, \\qquad p_0 = N_v\\, e^{-(E_F - E_v)/k_BT}"
    label: "Likevektskonsentrasjonene når $E_F$ ligger noen $k_BT$ fra båndkantene (Boltzmann-tilnærmingen). Avstanden fra $E_F$ til kanten står i eksponenten: 60 meV per tierpotens ved romtemperatur."
  - id: effektiv-tilstandstetthet
    section: Fra fordeling til konsentrasjon
    tex: "N_c = 2\\left(\\dfrac{2\\pi m_n^* k_BT}{h^2}\\right)^{3/2}"
    label: "Effektiv tilstandstetthet: hele ledningsbåndet regnet som $N_c$ tilstander lagt på $E_c$, slik at $n_0 = N_c f(E_c)$. For Si ved 300 K er $N_c \\approx 2{,}9 \\times 10^{19}$ cm⁻³ og $N_v \\approx 1{,}0 \\times 10^{19}$ cm⁻³; begge vokser som $T^{3/2}$."
  - id: massevirkningsloven
    section: Massevirkningsloven
    tex: "n_0 p_0 = n_i^2"
    label: "Ved termisk likevekt er produktet låst av materialet og temperaturen, uansett doping: dobler dopingen $n_0$, halveres $p_0$. Samme innhold som ratebalansen $r_i = a_r n_0 p_0 = g_i$, siden generasjonen bare avhenger av temperaturen."
  - id: intrinsisk-konsentrasjon
    section: Massevirkningsloven
    tex: "n_i = \\sqrt{N_c N_v}\\; e^{-E_g/2k_BT}"
    label: "Intrinsisk konsentrasjon, med <b>halve</b> gapet i eksponenten fordi $E_F$ ligger nær midten av det. For Si ved 300 K er $n_i = 1{,}5 \\times 10^{10}$ cm⁻³. Eksponenten dominerer temperaturavhengigheten; $T^{3/2}$-faktorene fra $N_c$ og $N_v$ synes knapt ved siden av."
  - id: ni-formene
    section: Massevirkningsloven
    tex: "n_0 = n_i\\, e^{(E_F - E_i)/k_BT}, \\qquad p_0 = n_i\\, e^{(E_i - E_F)/k_BT}"
    label: "Likevektskonsentrasjonene målt fra det intrinsiske nivået $E_i$. Står $E_F$ på $E_i$, er $n_0 = p_0 = n_i$, og avstanden $E_F - E_i$ forteller direkte hvor sterkt dopet materialet er."
  - id: dos-masse
    section: Effektiv masse for tilstandstetthet
    tex: "(m_n^*)^{3/2} = 6\\,(m_l\\, m_t^2)^{1/2}"
    label: "Effektiv masse for tilstandstetthet i Si: geometrisk middel av krumningsmassene i én dal, ganget opp med de seks dalene. Med $m_l = 0{,}98\\,m_0$ og $m_t = 0{,}19\\,m_0$ gir det $m_n^* = 1{,}1\\,m_0$, tallet som hører hjemme i $N_c$."
  - id: ladningsnoytralitet
    section: Kompensasjon og ladningsnøytralitet
    tex: "p_0 + N_d^+ = n_0 + N_a^-"
    label: "Ladningsnøytralitet: summen av positiv ladning (hull og ioniserte donorer) er lik summen av negativ (elektroner og ioniserte akseptorer). Sammen med $n_0 p_0 = n_i^2$ bestemmer kravet $n_0$, $p_0$ og $E_F$ entydig."
  - id: drifthastighet
    section: Drift
    tex: "\\langle v_x\\rangle = -\\dfrac{q\\tau}{m_n^*}\\,\\mathcal{E}_x, \\qquad \\mu_n = \\dfrac{q\\tau}{m_n^*}"
    label: "Drifthastigheten følger av at feltets kraft balanseres av kollisjoner hver $\\tau$ i gjennomsnitt. Mobiliteten $\\mu_n$ er drifthastigheten per felt, i cm²/V·s, og er positiv for begge bærertypene. For Si ved 300 K er $\\mu_n = 1350$ og $\\mu_p = 480$ cm²/V·s i rent materiale."
  - id: ledningsevne
    section: Drift
    tex: "J = q\\,(n\\mu_n + p\\mu_p)\\,\\mathcal{E} = \\sigma\\,\\mathcal{E}, \\qquad \\rho = \\dfrac{1}{\\sigma}, \\qquad R = \\rho\\,\\dfrac{L}{wt}"
    label: "Ohms lov med ledningsevnen skrevet ut i bærerkonsentrasjoner og mobiliteter. Begge bærertypene gir strøm <em>langs</em> feltet, siden hullene beveger seg med feltet og elektronene mot. Resistiviteten $\\rho$ er i Ω·cm, og staven med lengde $L$ og tverrsnitt $wt$ får resistansen $R$."
  - id: konduktivitetsmasse
    section: Drift
    tex: "\\dfrac{1}{m_n^*} = \\dfrac{1}{3}\\left(\\dfrac{1}{m_l} + \\dfrac{2}{m_t}\\right)"
    label: "Effektiv masse for ledningsevne i Si: massen står i nevneren i $\\mu_n$, så de tre retningene i en dal midles harmonisk. Med $m_l = 0{,}98\\,m_0$ og $m_t = 0{,}19\\,m_0$ gir det $0{,}26\\,m_0$, mot $1{,}1\\,m_0$ for telling av tilstander. I GaAs er dalen kuleformet, og begge massene er $0{,}067\\,m_0$."
  - id: matthiessen
    section: Spredning, temperatur og doping
    tex: "\\dfrac{1}{\\mu} = \\dfrac{1}{\\mu_\\text{gitter}} + \\dfrac{1}{\\mu_\\text{urenhet}}, \\qquad \\mu_\\text{gitter} \\sim T^{-3/2}, \\quad \\mu_\\text{urenhet} \\sim T^{3/2}"
    label: "Kollisjonssannsynlighetene legges sammen, så mobilitetene legges sammen invers, og den minste dominerer. Gitterspredning vokser med temperaturen, urenhetsspredning er sterkest for langsomme bærere i kaldt materiale. $10^{17}$ donorer per cm³ senker $\\mu_n$ i Si fra 1350 til 700 cm²/V·s ved 300 K."
  - id: hall-koeffisient
    section: Hall-effekten
    tex: "\\mathcal{E}_y = v_x\\mathcal{B}_z = R_H\\,J_x\\mathcal{B}_z, \\qquad R_H = \\dfrac{1}{qp_0}, \\qquad \\mu_p = \\dfrac{R_H}{\\rho}"
    label: "Hall-feltet bygges opp til det opphever den magnetiske avbøyningen. Hall-koeffisienten gir konsentrasjonen direkte, fortegnet på Hall-spenningen gir bærertypen (negativt for elektroner), og sammen med resistiviteten gir den mobiliteten."
  - id: fermi-flat
    section: Fermi-nivået ved likevekt
    tex: "\\dfrac{dE_F}{dx} = 0"
    label: "Fermi-nivået er konstant gjennom materialer i kontakt ved termisk likevekt. Raten $N_1 f_1 \\cdot N_2(1 - f_2)$ fra 1 til 2 må være lik raten motsatt vei ved hver energi, og det krever $f_1 = f_2$, altså $E_{F1} = E_{F2}$."
  - id: levetid
    section: Overskuddsbærere
    tex: "\\delta n(t) = \\Delta n\\, e^{-t/\\tau_n}, \\qquad \\tau_n = \\dfrac{1}{a_r(n_0 + p_0)} \\approx \\dfrac{1}{a_r p_0}"
    label: "Overskuddet dør ut eksponentielt med levetiden til minoritetsbærerne, her elektroner i p-type materiale. Gjelder ved lav injeksjon, der $\\delta n^2$-leddet i rekombinasjonen $a_r np$ kan strykes. Majoriteten faller med samme rate, siden bærerne forsvinner parvis."
  - id: stasjonaert-overskudd
    section: Kvasi-Fermi-nivåer
    tex: "\\delta n = \\delta p = g_\\text{op}\\,\\tau_n"
    label: "Stasjonært overskudd under jevn belysning: den optiske generasjonsraten ganger levetiden. Da er $np \\neq n_i^2$, og likevektens $E_F$ må byttes ut med to nivåer."
  - id: kvasi-fermi-nivaaer
    section: Kvasi-Fermi-nivåer
    tex: "n = n_i\\, e^{(F_n - E_i)/k_BT}, \\qquad p = n_i\\, e^{(E_i - F_p)/k_BT}"
    label: "Definisjonen av kvasi-Fermi-nivåene $F_n$ og $F_p$: samme form som likevektsuttrykkene, med hvert sitt nivå. I likevekt er $F_n = F_p = E_F$; avstanden $F_n - F_p$ måler hvor langt materialet er fra likevekt. Minoritetsnivået flytter seg mest."
  - id: diffusjonsstrom
    section: Diffusjon
    tex: "J_n^\\text{diff} = +qD_n\\dfrac{dn}{dx}, \\qquad J_p^\\text{diff} = -qD_p\\dfrac{dp}{dx}"
    label: "Diffusjonsstrømmene, fra partikkelfluksen $\\phi = -D\\,dn/dx$ ganger ladningen. Elektroner og hull i samme gradient beveger seg samme vei, men strømmene går motsatt, siden ladningene har ulikt fortegn. $D$ har enhet cm²/s; for Si er $D_n = 35$ og $D_p = 12{,}5$."
  - id: driftdiffusjonsstrom
    section: Diffusjon
    tex: "\\begin{aligned} J_n &= q\\mu_n n\\,\\mathcal{E} + qD_n\\dfrac{dn}{dx} \\\\ J_p &= q\\mu_p p\\,\\mathcal{E} - qD_p\\dfrac{dp}{dx} \\end{aligned}"
    label: "Hele strømmen for hver bærertype: et driftledd proporsjonalt med konsentrasjonen og et diffusjonsledd proporsjonalt med gradienten. Minoritetsbærerne bidrar lite til drift, men gradienten kan være stor, så minoritetsstrøm er nesten alltid diffusjon. $J = J_n + J_p$."
  - id: felt-baandskjema
    section: Diffusjon
    tex: "\\mathcal{E}(x) = \\dfrac{1}{q}\\dfrac{dE_i}{dx}"
    label: "Et felt tegnes som skrå bånd. Elektronets potensielle energi øker langs feltet, så båndene stiger i feltretningen, og stigningen er feltet. Elektroner driver nedover i skjemaet, hull oppover, og $\\mathcal{E}$ peker oppoverbakke."
  - id: einstein
    section: Einstein-relasjonen
    tex: "\\dfrac{D}{\\mu} = \\dfrac{k_BT}{q}"
    label: "Einstein-relasjonen, fra kravet om null strøm i likevekt med $dE_F/dx = 0$. Forholdet er $0{,}0259$ V ved romtemperatur, uansett bærertype og materiale, så måler du den ene av $D$ og $\\mu$, har du den andre."
  - id: kontinuitet
    section: Kontinuitetsligningen
    tex: "\\dfrac{\\partial\\,\\delta p}{\\partial t} = -\\dfrac{1}{q}\\dfrac{\\partial J_p}{\\partial x} - \\dfrac{\\delta p}{\\tau_p}, \\qquad \\dfrac{\\partial\\,\\delta n}{\\partial t} = +\\dfrac{1}{q}\\dfrac{\\partial J_n}{\\partial x} - \\dfrac{\\delta n}{\\tau_n}"
    label: "Kontinuitetsligningen: konsentrasjonen i en skive øker med nettoinnstrømmen av partikler og minker med rekombinasjonen. Fortegnet på strømleddet følger ladningen."
  - id: diffusjonsligning
    section: Kontinuitetsligningen
    tex: "\\dfrac{\\partial\\,\\delta n}{\\partial t} = D_n\\dfrac{\\partial^2\\,\\delta n}{\\partial x^2} - \\dfrac{\\delta n}{\\tau_n}"
    label: "Diffusjonsligningen: kontinuitetsligningen med ren diffusjonsstrøm satt inn. Krumningen i profilen jevner den ut, levetiden tømmer den. Tilsvarende for hull med $D_p$ og $\\tau_p$."

glossary:
  - term: Valensbånd
    section: Fra binding til bånd
    definition: "(<em>valence band</em>) Det øverste båndet som er fullt av elektroner ved 0 K. Toppen betegnes $E_v$. I Si rommer det $4N$ tilstander, akkurat nok til de $4N$ valenselektronene."
  - term: Ledningsbånd
    section: Fra binding til bånd
    definition: "(<em>conduction band</em>) Det nederste tomme båndet ved 0 K, med bunnen $E_c$. Elektroner som eksiteres hit har mange ledige tilstander rundt seg og kan derfor bidra til strøm."
  - term: Bloch-funksjon
    section: E–k-diagrammet
    definition: "Bølgefunksjonen til et elektron i et periodisk gitter: en planbølge multiplisert med en funksjon som har gitterets periodisitet. Den er grunnlaget for å beskrive elektronet ved én bølgevektor $k$."
  - term: Kronig-Penney-modellen
    section: E–k-diagrammet
    definition: "(<em>Kronig–Penney model</em>) Den enkleste modellen som gir bånd og gap: et 1D-gitter regnet som en uendelig, periodisk rekke rektangulære barrierer. Kontinuitet i $\\psi$ og $d\\psi/dx$ pluss Bloch-kravet knytter $E$ til $k$ i én ligning, og energiintervallene uten løsning er båndgapene."
  - term: E-k-diagram
    section: E–k-diagrammet
    definition: "Plott av elektronets totale energi mot bølgevektoren $k$, for én krystallretning. Stigningstallet gir hastigheten, krumningen gir effektiv masse, og formen avgjør om halvlederen er direkte eller indirekte."
  - term: Gruppehastighet
    section: E–k-diagrammet
    definition: "(<em>group velocity</em>) Farten til bølgepakken bæreren består av, $v = \\frac{1}{\\hbar}\\frac{dE}{dk}$, altså <b>stigningstallet</b> i $E(k)$. På bunnen av båndet er den null, uansett hvor stor $k$ er."
  - term: Direkte halvleder
    section: E–k-diagrammet
    definition: "(<em>direct semiconductor</em>) Ledningsbåndminimet og valensbåndmaksimet ligger ved <b>samme</b> $k$, som i GaAs ($E_g = 1{,}43$ eV). Et elektron kan falle rett ned og gi fra seg $E_g$ som et foton, og derfor brukes slike materialer i lysdioder og lasere."
  - term: Indirekte halvleder
    section: E–k-diagrammet
    definition: "(<em>indirect semiconductor</em>) Ledningsbåndminimet ligger ved en <b>annen</b> $k$ enn valensbåndmaksimet, som i Si. Overgangen krever en momentumendring i tillegg til energiendringen, og går gjerne via en defekttilstand med energien avgitt som varme."
  - term: Fonon
    section: E–k-diagrammet
    definition: "(<em>phonon</em>) Et kvantum av gittervibrasjon. Det bærer momentum på Brillouinsonens skala og svært lite energi, og er derfor partneren en indirekte halvleder må låne momentum av. Fotonet betaler energien, fononet momentumet."
  - term: Krystallmomentum
    section: Effektiv masse
    definition: "(<em>crystal momentum</em>) Størrelsen $\\hbar k$. Den oppfører seg som bevegelsesmengde overfor <em>ytre</em> krefter, og er likevel ikke elektronets virkelige bevegelsesmengde, siden gitterkreftene er utelatt."
  - term: Effektiv masse
    section: Effektiv masse
    definition: "(<em>effective mass</em>) Massen $m^*$ som lar oss bruke Newtons lov på en bærer i et gitter uten å regne på gitterkreftene: de er allerede pakket inn i tallet. Den finnes fra krumningen til $E(k)$, og er derfor ulik i ulike materialer selv om elektronets <em>ekte</em> masse er den samme."
  - term: Hull
    section: Elektroner og hull
    definition: "(<em>hole</em>) En tom tilstand i valensbåndet, regnet som én bærer med <b>positiv</b> ladning og <b>positiv</b> masse. Strømmen bæres av de gjenværende elektronene, og hullregnskapet gir samme svar med ett ledd i stedet for $10^{23}$."
  - term: Elektron-hull-par
    section: Intrinsisk materiale
    definition: "(<em>electron-hole pair</em>) Et ledningsbåndelektron og hullet det etterlot seg i valensbåndet, laget i samme eksitasjon (EHP). Termisk eller optisk energi $\\ge E_g$ kreves for å lage ett."
  - term: Intrinsisk halvleder
    section: Intrinsisk materiale
    definition: "(<em>intrinsic semiconductor</em>) En perfekt krystall uten dopanter eller gitterfeil, der de eneste bærerne er termisk genererte par. Da er $n = p = n_i$."
  - term: Ekstrinsisk halvleder
    section: Doping
    definition: "(<em>extrinsic semiconductor</em>) En halvleder der dopanter gjør likevektskonsentrasjonene $n_0$ og $p_0$ forskjellige fra $n_i$. Nesten alle komponenter er bygd av ekstrinsisk materiale."
  - term: Donor
    section: Doping
    definition: "En urenhet fra gruppe V (P, As, Sb) i Si eller Ge, med ett valenselektron til overs. Den legger et fylt nivå $E_d$ like under $E_c$ og står igjen som et fast positivt ion når elektronet er avgitt. Ved romtemperatur er praktisk talt alle ionisert i Si."
  - term: Akseptor
    section: Doping
    definition: "En urenhet fra gruppe III (B, Al, Ga, In) i Si eller Ge, med ett valenselektron for lite. Den legger et tomt nivå $E_a$ like over $E_v$, tar imot et valensbåndelektron og etterlater et hull."
  - term: n-type materiale
    section: Doping
    definition: "Halvleder dopet med donorer, der $n_0 \\gg (n_i, p_0)$. Elektroner er majoritetsbærere, hull er minoritetsbærere."
  - term: p-type materiale
    section: Doping
    definition: "Halvleder dopet med akseptorer, der $p_0 \\gg (n_i, n_0)$. Hull er majoritetsbærere, elektroner er minoritetsbærere."
  - term: Majoritetsbærere
    section: Doping
    definition: "(<em>majority carriers</em>) Bærertypen som dominerer etter doping, altså elektroner i n-type og hull i p-type. Dopingen kan endre antallet med mange tierpotenser."
  - term: Minoritetsbærere
    section: Doping
    definition: "(<em>minority carriers</em>) Den fåtallige bærertypen, altså hull i n-type og elektroner i p-type. De er få, og de styrer likevel oppførselen til pn-overganger og bipolare transistorer."
  - term: Fermi-Dirac-fordelingen
    section: Fermi–Dirac-fordelingen
    definition: "(<em>Fermi–Dirac distribution</em>) $f(E) = [1 + e^{(E - E_F)/k_BT}]^{-1}$, sannsynligheten for at en tillatt tilstand er okkupert ved termisk likevekt. Følger av at elektroner er identiske, har bølgenatur og lyder Pauli-prinsippet. Ved 0 K er den en firkant: alt under $E_F$ fullt, alt over tomt."
  - term: Fermi-nivå
    section: Fermi–Dirac-fordelingen
    definition: "(<em>Fermi level</em>) Energien $E_F$ der sannsynligheten for okkupasjon er nøyaktig $\\tfrac{1}{2}$. Fordelingen er symmetrisk om nivået, og plasseringen i gapet bærer hele bærerbildet: nær midten i intrinsisk materiale, nær $E_c$ i n-type og nær $E_v$ i p-type."
  - term: Tilstandstetthet
    section: Fra fordeling til konsentrasjon
    definition: "(<em>density of states</em>) $N(E)$, antall tilstander per volum og energienhet. Nær en båndkant vokser den som $\\sqrt{E - E_c}$, fra null på selve kanten. Produktet $f(E)N(E)$ er det som telles når $n_0$ skal regnes ut."
  - term: Effektiv tilstandstetthet
    section: Fra fordeling til konsentrasjon
    definition: "(<em>effective density of states</em>) $N_c$ og $N_v$: alle båndets fordelte tilstander representert som ett tall lagt på båndkanten, slik at $n_0 = N_c f(E_c)$. Av størrelsesorden $10^{19}$ cm⁻³ for Si ved 300 K, temperaturavhengig som $T^{3/2}$."
  - term: Boltzmann-tilnærmingen
    section: Fra fordeling til konsentrasjon
    definition: "(<em>Boltzmann approximation</em>) $f(E) \\approx e^{-(E - E_F)/k_BT}$ når $E - E_F$ er flere $k_BT$. Gjelder for vanlig doping, der $E_F$ holder seg unna båndkantene; svikter når dopingen presser $E_F$ helt inntil en kant."
  - term: Massevirkningsloven
    section: Massevirkningsloven
    definition: "(<em>mass action law</em>) $n_0 p_0 = n_i^2$ ved termisk likevekt, uansett doping. Doper du inn flere elektroner, forsvinner hull i samme faktor, og produktet står stille."
  - term: Intrinsisk nivå
    section: Massevirkningsloven
    definition: "(<em>intrinsic level</em>) $E_i$, energien $E_F$ har i intrinsisk materiale. Nivået ligger nær midten av gapet, forskjøvet litt fordi $N_c \\neq N_v$; i Si omtrent 13 meV under midten ved romtemperatur."
  - term: Kompensasjon
    section: Kompensasjon og ladningsnøytralitet
    definition: "(<em>compensation</em>) Donorer og akseptorer i samme krystall opphever hverandre: akseptornivåene fylles av donerte elektroner, og ledningsbåndet sitter igjen med netto $N_d - N_a$. Med $N_a = N_d$ oppfører materialet seg intrinsisk, fullt av dopanter."
  - term: Ladningsnøytralitet
    section: Kompensasjon og ladningsnøytralitet
    definition: "(<em>space charge neutrality</em>) Kravet $p_0 + N_d^+ = n_0 + N_a^-$: krystallen er nøytral, så positiv og negativ ladning balanserer. $E_F$ stiller seg dit kravet og massevirkningsloven er oppfylt samtidig."
  - term: Mobilitet
    section: Drift
    definition: "(<em>mobility</em>) Drifthastigheten en bærer får per felt, $\\mu = q\\tau/m^*$, i cm²/V·s. Lett effektiv masse og lang tid mellom kollisjoner gir høy mobilitet; for Si ved 300 K er $\\mu_n = 1350$ og $\\mu_p = 480$ cm²/V·s i rent materiale."
  - term: Midlere kollisjonstid
    section: Drift
    definition: "(<em>mean free time</em>) $\\tau$, gjennomsnittstiden mellom to spredninger for en bærer. Sannsynligheten for kollisjon i løpet av $dt$ er $dt/\\tau$, så antallet uspredte bærere faller som $e^{-t/\\tau}$. I Si ved romtemperatur er den rundt $0{,}2$ ps."
  - term: Gitterspredning
    section: Spredning, temperatur og doping
    definition: "(<em>lattice scattering</em>) Spredning mot gittervibrasjoner, altså fononer. Den øker med temperaturen og gir en mobilitet som faller omtrent som $T^{-3/2}$; i rent Si er det den som begrenser mobiliteten ved romtemperatur."
  - term: Urenhetsspredning
    section: Spredning, temperatur og doping
    definition: "(<em>impurity scattering</em>) Avbøyning i Coulomb-feltet fra ioniserte dopanter. Langsomme bærere bøyes mest, så mekanismen dominerer ved lav temperatur og høy doping, med en mobilitet som vokser omtrent som $T^{3/2}$."
  - term: Metningshastighet
    section: Spredning, temperatur og doping
    definition: "(<em>saturation velocity</em>) Den øvre grensen for drifthastigheten ved høye felt, i Si omtrent $10^7$ cm/s. Over rundt $10^3$ V/cm holder ikke $v_d = \\mu\\mathcal{E}$ lenger; energien feltet tilfører går til gitteret, og strømmen blir nesten uavhengig av feltet."
  - term: Hall-effekten
    section: Hall-effekten
    definition: "(<em>Hall effect</em>) Et magnetfelt på tvers av strømmen bøyer bærerne av mot den ene kanten til et tverrfelt $\\mathcal{E}_y = v_x\\mathcal{B}_z$ opphever avbøyningen. Spenningen på tvers, Hall-spenningen, gir bærertype, konsentrasjon og, sammen med resistansen, mobilitet."
  - term: Hall-koeffisient
    section: Hall-effekten
    definition: "(<em>Hall coefficient</em>) $R_H = \\mathcal{E}_y/J_x\\mathcal{B}_z = 1/qp_0$ for hull. Negativ for elektroner, siden $q$ bytter fortegn. Forholdet $R_H/\\rho$ er mobiliteten."
  - term: Overskuddsbærere
    section: Overskuddsbærere
    definition: "(<em>excess carriers</em>) Bærere ut over likevektskonsentrasjonene, $\\delta n = n - n_0$ og $\\delta p = p - p_0$, laget av lys med $h\\nu \\ge E_g$ eller sprøytet inn over en kontakt. De lages og rekombinerer parvis, så $\\delta n = \\delta p$ uten fangst."
  - term: Lav injeksjon
    section: Overskuddsbærere
    definition: "(<em>low-level injection</em>) Overskuddet er lite mot majoritetskonsentrasjonen, $\\delta n \\ll p_0$ i p-type. Da kan $\\delta n^2$-leddet i rekombinasjonen strykes, og overskuddet dør ut eksponentielt med én levetid."
  - term: Levetid
    section: Overskuddsbærere
    definition: "(<em>minority carrier lifetime</em>) $\\tau_n = 1/a_r p_0$ i p-type materiale: tiden det tar før overskuddet er falt til $1/e$. Kalles levetiden til minoritetsbærerne, siden regningen er gjort for dem, men majoriteten faller med samme rate."
  - term: Rekombinasjonssenter
    section: Overskuddsbærere
    definition: "(<em>recombination center</em>) En urenhet eller defekt med et nivå $E_r$ i gapet som fanger først den ene bærertypen og så den andre, og gir energien til gitteret som varme. Dominerer rekombinasjonen i indirekte materialer som Si og Ge; dype nivåer som gull i Si er de mest effektive."
  - term: Felle
    section: Overskuddsbærere
    definition: "(<em>trap</em>) Et senter som slipper den fangede bæreren tilbake til båndet før den andre bærertypen kommer. Grunne nivåer virker oftest som feller, dype nivåer oftest som rekombinasjonssentre."
  - term: Kvasi-Fermi-nivå
    section: Kvasi-Fermi-nivåer
    definition: "(<em>quasi-Fermi level</em>, IMREF) Hver bærertype sitt eget nivå utenfor likevekt, definert ved $n = n_i e^{(F_n - E_i)/k_BT}$ og $p = n_i e^{(E_i - F_p)/k_BT}$. I likevekt er $F_n = F_p = E_F$; splittingen $F_n - F_p$ måler avstanden fra likevekt, og minoritetsnivået flytter seg mest."
  - term: Diffusjon
    section: Diffusjon
    definition: "(<em>diffusion</em>) Netto bevegelse fra høy til lav konsentrasjon som følger av tilfeldig termisk bevegelse alene. Partikkelfluksen er $\\phi_n = -D_n\\,dn/dx$, og diffusjonsstrømmen er fluksen ganger ladningen, så elektron- og hullstrømmene går hver sin vei i samme gradient."
  - term: Diffusjonskoeffisient
    section: Diffusjon
    definition: "(<em>diffusion coefficient</em>) $D = l^2/2\\tau$ i den enkle modellen, i cm²/s. Knyttet til mobiliteten ved Einstein-relasjonen $D/\\mu = k_BT/q$; for Si er $D_n = 35$ og $D_p = 12{,}5$ cm²/s."
  - term: Innebygd felt
    section: Einstein-relasjonen
    definition: "(<em>built-in field</em>) Feltet som må finnes i likevekt der konsentrasjonen varierer, for eksempel i en dopinggradient: det driver bærerne tilbake akkurat like fort som de diffunderer, så nettostrømmen er null og $E_F$ er flat."
  - term: Einstein-relasjonen
    section: Einstein-relasjonen
    definition: "(<em>Einstein relation</em>) $D/\\mu = k_BT/q$, som følger av null strøm og flatt $E_F$ i likevekt. Forholdet er $0{,}0259$ V ved romtemperatur for begge bærertypene i alle materialer."
  - term: Kontinuitetsligningen
    section: Kontinuitetsligningen
    definition: "(<em>continuity equation</em>) $\\partial\\,\\delta p/\\partial t = -(1/q)\\,\\partial J_p/\\partial x - \\delta p/\\tau_p$: overskuddet i en skive vokser med nettoinnstrømmen og faller med rekombinasjonen. Med ren diffusjonsstrøm blir den diffusjonsligningen."

